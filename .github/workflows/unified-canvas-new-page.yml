name: Unified canvas new page regression

on:
  push:
    branches:
      - 'feat/unified-infinite-canvas-creation'
  pull_request:
    paths:
      - 'portal/shell.js'
      - 'portal/shell.css'
      - 'server/agent-server.mjs'
      - '.claude/skills/create-new-page/**'
      - 'AGENTS.md'
      - 'tests/unified-new-page.test.mjs'
      - 'tests/new-page-context.test.mjs'
      - 'tests/page-presentation.browser.mjs'
      - '.github/workflows/unified-canvas-new-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: New-page and canvas unit tests
        run: |
          node --test tests/new-page-context.test.mjs tests/unified-new-page.test.mjs tests/canvas-baseline.test.mjs tests/canvas-core.test.mjs tests/canvas-version-model.test.mjs tests/pi-skills.test.mjs tests/share-download.test.mjs tests/agent-provider-create-mode.test.mjs
      - name: Legacy page, canvas and sharing tests
        run: |
          python3 -m unittest discover -s tests -p 'test_page_presentation.py'
          python3 -m unittest discover -s tests -p 'test_canvas_store.py'
          python3 -m unittest discover -s tests -p 'test_canvas_versions.py'
          python3 -m unittest discover -s tests -p 'test_canvas_export_versions.py'
          python3 -m unittest discover -s tests -p 'test_share_download.py'
      - name: Full browser presentation regression
        run: node tests/page-presentation.browser.mjs
