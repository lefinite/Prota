name: Windows desktop launcher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run pi:build
      - run: npm run pi:verify
      - run: npm run agent:test
      - name: Cold install and warm GUI startup
        shell: powershell
        run: ./tests/windows-desktop.ps1
      - name: Keep isolated test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-launcher-diagnostics
          path: |
            ${{ runner.temp }}/prota-test-logs
            ${{ runner.temp }}/prota-service-logs
          retention-days: 3
