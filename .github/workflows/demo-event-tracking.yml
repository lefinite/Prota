name: Demo Event Tracking
on:
  push:
    branches:
      - feat/demo-event-tracking-skill-plan
  pull_request:
    paths:
      - 'portal/modules/tracking/**'
      - 'portal/shell.js'
      - 'server/demo_tracking_review.py'
      - 'server/bridge.py'
      - 'tests/demo-event-tracking.test.mjs'
      - 'tests/test_demo_tracking_review.py'
      - '.github/workflows/demo-event-tracking.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and unit tests
        run: |
          node --check portal/shell.js
          node --check portal/modules/tracking/index.js
          node --test tests/demo-event-tracking.test.mjs
      - name: Python syntax and offline reviewer unit tests
        run: |
          python3 -m py_compile server/bridge.py server/demo_tracking_review.py
          python3 -m unittest tests/test_demo_tracking_review.py
