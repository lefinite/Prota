<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292"
     role="img" aria-labelledby="ds-title ds-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="ds-title">160 套设计系统</title>
  <desc id="ds-desc">Readify 内置 160 套设计系统，从暗夜终端、杂志衬线到粗野主义，每套都可直接套用到生成的原型上。此处展示六张样本。</desc>

  <defs>
    <linearGradient id="wfbg2" x1="0" y1="0" x2="1200" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1026"/>
      <stop offset="1" stop-color="#0A0F23"/>
    </linearGradient>
    <linearGradient id="stripe-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7a73ff"/><stop offset="1" stop-color="#635bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="292" rx="24" fill="url(#wfbg2)"/>

  <!-- header -->
  <g transform="translate(52 44)">
    <text font-size="14" letter-spacing="2.6" fill="#00F5D4" font-family="ui-monospace, 'SF Mono', Menlo, monospace">DESIGN SYSTEMS · 160</text>
    <text y="32" font-size="24" font-weight="700" fill="#F4F6FF">从极客暗黑到杂志衬线，总有一套对味</text>
  </g>
  <text x="1148" y="76" font-size="13" fill="#7E8AB5" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">+ 自定义 token</text>

  <!-- ===== specimen cards: width 166, height 168, y 108 ===== -->

  <!-- 1. midnight-terminal -->
  <g transform="translate(52 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect width="142" height="96" rx="8" fill="#0b1220"/>
      <circle cx="12" cy="12" r="3" fill="#ef4444"/><circle cx="24" cy="12" r="3" fill="#f59e0b"/><circle cx="36" cy="12" r="3" fill="#10b981"/>
      <rect x="10" y="28" width="92" height="5" rx="2.5" fill="#5eead4"/>
      <rect x="10" y="40" width="112" height="4" rx="2" fill="#334155"/>
      <rect x="10" y="50" width="82" height="4" rx="2" fill="#334155"/>
      <rect x="10" y="60" width="100" height="4" rx="2" fill="#334155"/>
      <rect x="10" y="74" width="46" height="14" rx="7" fill="#5eead4"/>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">暗夜终端</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">midnight-terminal</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" rx="3" fill="#0b1220" stroke="#8A93B5" stroke-opacity="0.4"/>
      <rect x="24" width="20" height="8" rx="3" fill="#5eead4"/>
      <rect x="48" width="20" height="8" rx="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- 2. editorial-serif -->
  <g transform="translate(238 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect width="142" height="96" rx="8" fill="#fdfaf3"/>
      <text x="12" y="30" font-size="17" font-family="Georgia, 'Songti SC', serif" font-weight="700" fill="#1a1a1a">Editorial</text>
      <rect x="12" y="38" width="56" height="1.6" fill="#111827"/>
      <rect x="12" y="50" width="100" height="3.4" rx="1.7" fill="#6b7280"/>
      <rect x="12" y="60" width="92" height="3.4" rx="1.7" fill="#6b7280"/>
      <rect x="12" y="70" width="72" height="3.4" rx="1.7" fill="#6b7280"/>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">编辑衬线</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">editorial-serif</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" rx="3" fill="#fdfaf3" stroke="#8A93B5" stroke-opacity="0.4"/>
      <rect x="24" width="20" height="8" rx="3" fill="#111827"/>
      <rect x="48" width="20" height="8" rx="3" fill="#6b7280"/>
    </g>
  </g>

  <!-- 3. apple -->
  <g transform="translate(424 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect width="142" height="96" rx="8" fill="#ffffff"/>
      <rect x="12" y="16" width="52" height="7" rx="3.5" fill="#1d1d1f"/>
      <rect x="12" y="34" width="96" height="4" rx="2" fill="#86868b"/>
      <rect x="12" y="44" width="84" height="4" rx="2" fill="#86868b"/>
      <rect x="12" y="68" width="52" height="16" rx="8" fill="#0071e3"/>
      <text x="38" y="79" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">购买 ›</text>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">Apple 风</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">apple</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" rx="3" fill="#ffffff" stroke="#8A93B5" stroke-opacity="0.4"/>
      <rect x="24" width="20" height="8" rx="3" fill="#1d1d1f"/>
      <rect x="48" width="20" height="8" rx="3" fill="#0071e3"/>
    </g>
  </g>

  <!-- 4. stripe -->
  <g transform="translate(610 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect width="142" height="96" rx="8" fill="#f6f9fc"/>
      <rect x="12" y="14" width="118" height="7" rx="3.5" fill="url(#stripe-grad)"/>
      <rect x="12" y="32" width="64" height="6" rx="3" fill="#0a2540"/>
      <rect x="12" y="48" width="104" height="4" rx="2" fill="#425466"/>
      <rect x="12" y="58" width="90" height="4" rx="2" fill="#425466"/>
      <rect x="12" y="72" width="50" height="15" rx="7.5" fill="#635bff"/>
      <text x="37" y="83" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Pay now</text>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">Stripe 紫</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">stripe</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" rx="3" fill="#f6f9fc" stroke="#8A93B5" stroke-opacity="0.4"/>
      <rect x="24" width="20" height="8" rx="3" fill="#635bff"/>
      <rect x="48" width="20" height="8" rx="3" fill="#0a2540"/>
    </g>
  </g>

  <!-- 5. vercel -->
  <g transform="translate(796 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect width="142" height="96" rx="8" fill="#000000"/>
      <path d="M22 24 l9 16 l9 -16 Z" fill="#ffffff"/>
      <text x="46" y="37" font-size="13" font-weight="700" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Vercel</text>
      <rect x="12" y="50" width="92" height="4" rx="2" fill="#888888"/>
      <rect x="12" y="60" width="78" height="4" rx="2" fill="#888888"/>
      <rect x="12" y="70" width="100" height="4" rx="2" fill="#888888"/>
      <rect x="12" y="82" width="44" height="3" rx="1.5" fill="#ffffff"/>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">极简黑白</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">vercel</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" rx="3" fill="#000000" stroke="#8A93B5" stroke-opacity="0.4"/>
      <rect x="24" width="20" height="8" rx="3" fill="#ffffff"/>
      <rect x="48" width="20" height="8" rx="3" fill="#888888"/>
    </g>
  </g>

  <!-- 6. brutalism -->
  <g transform="translate(982 108)">
    <rect width="166" height="168" rx="14" fill="#111A36" stroke="#2447FF" stroke-opacity="0.22"/>
    <g transform="translate(12 12)">
      <rect x="3" y="3" width="142" height="96" fill="#000000"/>
      <rect width="142" height="96" fill="#ffe600" stroke="#000000" stroke-width="2"/>
      <rect x="12" y="14" width="64" height="9" fill="#000000"/>
      <rect x="12" y="32" width="100" height="4" fill="#000000"/>
      <rect x="12" y="42" width="86" height="4" fill="#000000"/>
      <rect x="12" y="52" width="74" height="4" fill="#000000"/>
      <rect x="14" y="68" width="54" height="18" fill="#000000"/>
      <text x="41" y="80" font-size="10" font-weight="800" fill="#ffe600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">CLICK</text>
    </g>
    <text x="14" y="130" font-size="14" font-weight="700" fill="#F4F6FF">粗野主义</text>
    <text x="14" y="146" font-size="11" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">brutalism</text>
    <g transform="translate(14 156)">
      <rect width="20" height="8" fill="#ffe600" stroke="#000000" stroke-width="1.2"/>
      <rect x="24" width="20" height="8" fill="#000000"/>
      <rect x="48" width="20" height="8" fill="#ff3d00"/>
    </g>
  </g>
</svg>
