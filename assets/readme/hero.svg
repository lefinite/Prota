<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="hero-title">Readify — AI 原型工作台</title>
  <desc id="hero-desc">Readify（门户代号 Prota）把 PRD 与自然语言变成可交互、可批注、一键分享的移动端与 Web 端 UI 原型。右侧为一张由 PRD 生成的手机阅读页原型。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1026"/>
      <stop offset="0.62" stop-color="#0C1330"/>
      <stop offset="1" stop-color="#0A1024"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2447FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2447FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#00F5D4" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#0B1026"/>
      <stop offset="0.48" stop-color="#2447FF"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#13204A"/>
      <stop offset="1" stop-color="#0E1632"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <ellipse cx="980" cy="120" rx="320" ry="220" fill="url(#halo)"/>
  <ellipse cx="820" cy="330" rx="260" ry="150" fill="url(#halo2)"/>

  <!-- LEFT: title block -->
  <g transform="translate(64 0)">
    <!-- brand mark -->
    <g transform="translate(0 56)">
      <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#mark)"/>
      <path d="M13 35V12h15c5 0 8.7 3.5 8.7 8.4S33 29 28 29h-7v6Zm8-12h7.4c2 0 3.3-1 3.3-2.4s-1.3-2.4-3.3-2.4H21Z" fill="#FFFFFF"/>
      <path d="M39 9l2 5.3 5.3 2L41 18.6 39 24l-2-5.4-5.3-2 5.3-2Z" fill="#FFFFFF" opacity="0.92"/>
      <text x="62" y="20" font-size="15" letter-spacing="2.6" fill="#00F5D4" font-family="ui-monospace, 'SF Mono', Menlo, monospace">AI · PROTOTYPING WORKBENCH</text>
      <text x="62" y="40" font-size="13" letter-spacing="0.4" fill="#8A93B5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">门户代号 Prota</text>
    </g>

    <!-- title -->
    <text x="0" y="172" font-size="84" font-weight="700" letter-spacing="-2" fill="#F4F6FF">Readify</text>

    <!-- subtitle -->
    <text x="2" y="214" font-size="23" fill="#C8CEEC">把 PRD 与自然语言，变成可交互、可批注、</text>
    <text x="2" y="244" font-size="23" fill="#C8CEEC">一键分享的移动端 / Web 端 UI 原型。</text>

    <!-- chips -->
    <g transform="translate(2 274)" font-size="14.5" font-weight="600">
      <g>
        <rect x="0" y="0" width="156" height="34" rx="17" fill="#2447FF" fill-opacity="0.16" stroke="#2447FF" stroke-opacity="0.5"/>
        <circle cx="17" cy="17" r="4.5" fill="#00F5D4"/>
        <text x="31" y="22" fill="#E6ECFF">160 套设计系统</text>
      </g>
      <g transform="translate(172 0)">
        <rect x="0" y="0" width="158" height="34" rx="17" fill="#2447FF" fill-opacity="0.16" stroke="#2447FF" stroke-opacity="0.5"/>
        <circle cx="17" cy="17" r="4.5" fill="#00F5D4"/>
        <text x="31" y="22" fill="#E6ECFF">70+ Agent 技能</text>
      </g>
      <g transform="translate(344 0)">
        <rect x="0" y="0" width="146" height="34" rx="17" fill="#2447FF" fill-opacity="0.16" stroke="#2447FF" stroke-opacity="0.5"/>
        <circle cx="17" cy="17" r="4.5" fill="#00F5D4"/>
        <text x="31" y="22" fill="#E6ECFF">版本化 · 分享</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: device-frame proof — a PRD-generated reader prototype -->
  <g transform="translate(744 28)">
    <!-- phone body -->
    <rect x="40" y="6" width="288" height="332" rx="40" fill="#070B1C" stroke="#2447FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="50" y="16" width="268" height="312" rx="32" fill="url(#screen)"/>
    <!-- notch -->
    <rect x="156" y="20" width="56" height="14" rx="7" fill="#070B1C"/>

    <!-- screen: reader app -->
    <g transform="translate(50 16)">
      <!-- status bar -->
      <text x="26" y="38" font-size="11" fill="#8FA0CC" font-family="ui-monospace, 'SF Mono', Menlo, monospace">9:41</text>
      <circle cx="232" cy="34" r="3" fill="#8FA0CC"/>
      <rect x="218" y="31" width="18" height="6" rx="3" fill="none" stroke="#8FA0CC" stroke-width="1"/>

      <!-- chapter title -->
      <text x="26" y="68" font-size="13" fill="#7E8AB5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">第三章</text>
      <text x="26" y="90" font-size="18" font-weight="600" fill="#F4F6FF">山月不知心底事</text>

      <!-- body lines -->
      <rect x="26" y="108" width="216" height="7" rx="3.5" fill="#C2CBE8" opacity="0.85"/>
      <rect x="26" y="124" width="216" height="7" rx="3.5" fill="#C2CBE8" opacity="0.85"/>
      <rect x="26" y="140" width="176" height="7" rx="3.5" fill="#C2CBE8" opacity="0.85"/>
      <!-- highlight line (mint, like selection) -->
      <rect x="24" y="156" width="200" height="16" rx="4" fill="#00F5D4" fill-opacity="0.16"/>
      <rect x="26" y="160" width="196" height="7" rx="3.5" fill="#00F5D4" opacity="0.95"/>
      <rect x="26" y="184" width="216" height="7" rx="3.5" fill="#C2CBE8" opacity="0.85"/>
      <rect x="26" y="200" width="150" height="7" rx="3.5" fill="#C2CBE8" opacity="0.85"/>

      <!-- Aa settings pill (reader settings panel from PRD) -->
      <g transform="translate(26 220)">
        <rect x="0" y="0" width="216" height="60" rx="14" fill="#0B1538" stroke="#2447FF" stroke-opacity="0.4"/>
        <circle cx="30" cy="30" r="15" fill="#2447FF" fill-opacity="0.2" stroke="#2447FF" stroke-opacity="0.6"/>
        <text x="30" y="35" font-size="13" font-weight="700" fill="#BFFFF8" text-anchor="middle">Aa</text>
        <rect x="56" y="19" width="120" height="6" rx="3" fill="#2447FF" fill-opacity="0.35"/>
        <circle cx="150" cy="22" r="8" fill="#00F5D4"/>
        <rect x="56" y="37" width="70" height="5" rx="2.5" fill="#8A93B5" opacity="0.5"/>
        <rect x="56" y="47" width="96" height="5" rx="2.5" fill="#8A93B5" opacity="0.35"/>
      </g>

      <!-- page nav dots -->
      <g transform="translate(26 296)" fill="#2447FF">
        <circle cx="0" cy="0" r="3.5" fill="#00F5D4"/>
        <circle cx="14" cy="0" r="3.5" opacity="0.5"/>
        <circle cx="28" cy="0" r="3.5" opacity="0.5"/>
        <text x="206" y="4" font-size="10" fill="#7E8AB5" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">v13 · 32%</text>
      </g>
    </g>

    <!-- token swatch dots -->
    <g transform="translate(40 350)">
      <circle cx="0" cy="0" r="5" fill="#0B1026" stroke="#8A93B5" stroke-opacity="0.4"/>
      <circle cx="16" cy="0" r="5" fill="#2447FF"/>
      <circle cx="32" cy="0" r="5" fill="#00F5D4"/>
      <circle cx="48" cy="0" r="5" fill="#96FFF2"/>
      <text x="72" y="4" font-size="11" fill="#7E8AB5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">design-tokens.json</text>
    </g>

    <!-- PRD -> UI transform cue (drawn last, floats on top) -->
    <g transform="translate(-150 22)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <rect x="0" y="0" width="148" height="44" rx="13" fill="#070B1C" stroke="#00F5D4" stroke-opacity="0.6"/>
      <text x="15" y="19" font-size="11" fill="#7E8AB5">PRD.md</text>
      <text x="15" y="34" font-size="11" fill="#C8CEEC">ai-prd-v6.md</text>
    </g>
    <!-- connector from cue into the phone -->
    <path d="M-3 62 H34" stroke="#00F5D4" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.8"/>
    <path d="M30 56 l7 6 l-7 6" fill="none" stroke="#00F5D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
