<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Readify Mobile Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" />
              </svg>
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0"
                />
              </svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <section class="placeholder-panel">
              <span class="placeholder-panel__eyebrow">Readify</span>
              <h1>新增页面标题</h1>
              <p>在这里替换为当前页面的核心内容。</p>
            </section>
          </main>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
    <script src="./frame-fit.js"></script>
</body>
</html>
