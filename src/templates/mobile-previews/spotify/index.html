<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>夜航电台 · Spotify</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" />
              </svg>
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0"
                />
              </svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 1. 顶部品牌栏 -->
            <header class="brand-bar">
              <div class="brand-bar__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <circle cx="6" cy="18" r="2.6" />
                  <circle cx="12" cy="15" r="2.6" />
                  <circle cx="18" cy="12" r="2.6" />
                  <path d="M8.4 16.2c2.4-1.6 4.2-2.2 7.2-4.4M6.6 15.2C9 13.6 10.8 13 13.8 10.8" />
                </svg>
              </div>
              <div class="brand-bar__text">
                <span class="brand-bar__name">夜航电台</span>
                <span class="brand-bar__sub">晚上好 · 继续昨夜的旅程</span>
              </div>
              <button class="brand-bar__icon" type="button" data-toast="音质已切换为高音质（会员）" aria-label="播放设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12V8a7 7 0 0 1 14 0v4" />
                  <path d="M3.5 12h17v5a2 2 0 0 1-2 2h-2v-7M8.5 19v-7" />
                </svg>
              </button>
            </header>

            <!-- 2. Hero / 签名卡：正在播放 -->
            <section class="now" aria-label="正在播放">
              <div class="now__meta">
                <div class="now__art art art--now" aria-hidden="true"><span>♫</span></div>
                <div class="now__info">
                <p class="now__from">私人雷达 · 歌单</p>
                <h1 class="now__title" id="nowTitle">城市灯河</h1>
                  <p class="now__artist" id="nowArtist">凌晨三点俱乐部</p>
                </div>
              </div>
              <div class="now__progress">
                <div class="now__track" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38" id="nowTrack">
                  <span class="now__fill" id="nowFill"></span>
                </div>
                <div class="now__times">
                  <span id="nowElapsed">1:29</span>
                  <span id="nowTotal">3:56</span>
                </div>
              </div>
              <div class="now__controls">
                <button class="now__side" type="button" data-toast="随机播放已开启" aria-label="随机播放">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h4v4M20 4l-6.5 6.5M4 20l6-6M16 20h4v-4M20 20l-5.5-5.5M4 4l5 5" />
                  </svg>
                </button>
                <button class="now__side" type="button" id="prevBtn" aria-label="上一首">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 5h2.4v14H6zM20 5v14l-10-7z" />
                  </svg>
                </button>
                <button class="now__play" type="button" id="playBtn" aria-label="播放或暂停">
                  <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                    <path d="M8 5.1v13.8L19 12z" />
                  </svg>
                </button>
                <button class="now__side" type="button" id="nextBtn" aria-label="下一首">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.6 5H18v14h-2.4zM4 5v14l10-7z" />
                  </svg>
                </button>
                <button class="now__side now__side--like" type="button" id="likeBtn" aria-label="收藏这首歌" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                    <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                  </svg>
                </button>
              </div>
            </section>

            <!-- 3. 两张内容卡：为你推荐 -->
            <section class="picks" aria-label="为你推荐">
              <button class="pick" type="button" data-toast="歌单「深夜代码」已加入队列">
                <span class="pick__art art art--code" aria-hidden="true"></span>
                <span class="pick__body">
                  <b>深夜代码</b>
                  <i>专注歌单 · 42 首</i>
                </span>
                <span class="pick__play" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.1v13.8L19 12z" /></svg>
                </span>
              </button>
              <button class="pick" type="button" data-toast="白噪音「雨声」开始循环播放">
                <span class="pick__art art art--rain" aria-hidden="true"></span>
                <span class="pick__body">
                  <b>雨声</b>
                  <i>白噪音 · 循环</i>
                </span>
                <span class="pick__play" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.1v13.8L19 12z" /></svg>
                </span>
              </button>
            </section>

            <!-- 4. 今晚的队列 Feed -->
            <section class="feed" aria-label="今晚的队列">
              <div class="feed__head">
                <h2 class="feed__title">今晚的队列</h2>
                <div class="chips" role="tablist" aria-label="筛选队列">
                  <button class="chip is-active" type="button" data-filter="all">全部</button>
                  <button class="chip" type="button" data-filter="song">歌曲</button>
                  <button class="chip" type="button" data-filter="noise">白噪音</button>
                  <button class="chip" type="button" data-filter="saved">已下载</button>
                </div>
              </div>
              <ul class="feed__list" id="feedList">
                <li class="feed-item is-playing" data-kind="song" data-index="0" tabindex="0" role="button" aria-label="播放 城市灯河">
                  <span class="feed-item__art art art--now" aria-hidden="true"></span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">城市灯河</span>
                    <span class="feed-item__meta">凌晨三点俱乐部 <em class="feed-item__chip is-live">播放中</em></span>
                  </div>
                  <b class="feed-item__dur">3:56</b>
                  <button class="feed-item__like" type="button" aria-label="收藏这首歌" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="song" data-index="1" tabindex="0" role="button" aria-label="播放 隧道尽头的便利店">
                  <span class="feed-item__art art art--conv" aria-hidden="true"></span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">隧道尽头的便利店</span>
                    <span class="feed-item__meta">南方公园乐队 <em class="feed-item__chip is-new">新增</em></span>
                  </div>
                  <b class="feed-item__dur">4:12</b>
                  <button class="feed-item__like" type="button" aria-label="收藏这首歌" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="noise" data-index="2" tabindex="0" role="button" aria-label="播放 午夜列车 白噪音">
                  <span class="feed-item__art art art--train" aria-hidden="true"></span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">午夜列车</span>
                    <span class="feed-item__meta">白噪音 · 车厢声 <em class="feed-item__chip">循环</em></span>
                  </div>
                  <b class="feed-item__dur">30:00</b>
                  <button class="feed-item__like" type="button" aria-label="收藏这段白噪音" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="song" data-index="3" tabindex="0" role="button" aria-label="播放 蓝调时刻">
                  <span class="feed-item__art art art--blue" aria-hidden="true"></span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">蓝调时刻</span>
                    <span class="feed-item__meta">凌晨三点俱乐部 <em class="feed-item__chip is-saved">已下载</em></span>
                  </div>
                  <b class="feed-item__dur">3:24</b>
                  <button class="feed-item__like is-on" type="button" aria-label="收藏这首歌" aria-pressed="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="song" data-index="4" tabindex="0" role="button" aria-label="播放 街角快照">
                  <span class="feed-item__art art art--film" aria-hidden="true"></span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">街角快照</span>
                    <span class="feed-item__meta">胶片剧团</span>
                  </div>
                  <b class="feed-item__dur">2:58</b>
                  <button class="feed-item__like" type="button" aria-label="收藏这首歌" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.6-9.5-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.5 12c-2 4.4-9.5 9-9.5 9z" />
                    </svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 5. 操作区 -->
            <section class="action-area" aria-label="搜索与播放">
              <input class="quick-input" id="quickInput" type="text" placeholder="搜索歌曲、歌手或电台…" />
              <div class="action-row">
                <button class="btn-primary" type="button" id="queueBtn">播放队列</button>
                <button class="btn-ghost" type="button" data-toast="已根据今晚的收听生成随机电台">随机电台</button>
              </div>
            </section>
          </main>

          <!-- 6. 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tabbar__item is-active" type="button" data-tab="首页">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z" />
              </svg>
              <span>首页</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="搜索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="11" cy="11" r="7" /><path d="M16.5 16.5L21 21" />
              </svg>
              <span>搜索</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="资料库">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5v14M9 5v14M14 6l5 13" />
              </svg>
              <span>资料库</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="播客">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
              <span>播客</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
