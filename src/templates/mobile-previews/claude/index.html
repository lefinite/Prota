<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>拾页 · Claude 设计系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" />
              </svg>
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0"
                />
              </svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 1. 顶部品牌栏 -->
            <header class="brand-bar">
              <div class="brand-bar__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                  <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" />
                </svg>
              </div>
              <div class="brand-bar__text">
                <span class="brand-bar__name">拾页</span>
                <span class="brand-bar__sub">第 214 期 · 周五晚刊</span>
              </div>
              <button class="brand-bar__icon" type="button" data-toast="已同步离线书库，断网也能读" aria-label="离线书库">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                </svg>
              </button>
            </header>

            <!-- 2. Hero / 签名卡：今日引言（衬线大字 + 手绘波纹 + terracotta 进度） -->
            <section class="quote-card" aria-label="今日引言">
              <span class="quote-card__label">今日引言</span>
              <p class="quote-card__text">「人一旦习惯了天空，就再也无法忍受地面。」</p>
              <p class="quote-card__author">圣埃克苏佩里 · 《夜间飞行》</p>
              <svg class="quote-card__squiggle" viewBox="0 0 120 8" aria-hidden="true">
                <path
                  d="M0 4 Q 7.5 0.5, 15 4 T 30 4 T 45 4 T 60 4 T 75 4 T 90 4 T 105 4 T 120 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
              <div class="quote-card__progress">
                <span class="quote-card__progress-label">本期已读</span>
                <div class="quote-card__track">
                  <span class="quote-card__fill" style="--w: 62%"></span>
                </div>
                <b class="quote-card__pct">62%</b>
              </div>
            </section>

            <!-- 3. 两张内容卡 -->
            <section class="duo-grid" aria-label="阅读与批注">
              <div class="duo-card">
                <h2 class="duo-card__title">本周阅读</h2>
                <p class="duo-card__num">142<span> 分钟</span></p>
                <p class="duo-card__note">比上周多读 18 分钟</p>
                <div class="week-bars" role="img" aria-label="近 7 天阅读时长，今日 34 分钟">
                  <span style="--h: 38%"></span>
                  <span style="--h: 62%"></span>
                  <span style="--h: 45%"></span>
                  <span style="--h: 78%"></span>
                  <span style="--h: 56%"></span>
                  <span style="--h: 30%"></span>
                  <span class="is-today" style="--h: 68%"></span>
                </div>
              </div>
              <div class="duo-card">
                <h2 class="duo-card__title">批注本</h2>
                <p class="duo-card__num"><b id="noteCount">36</b><span> 条</span></p>
                <p class="duo-card__note">12 条待回顾 · 3 条金句</p>
                <div class="dots" aria-hidden="true">
                  <i class="is-on"></i><i class="is-on"></i><i class="is-on"></i><i></i><i></i><i></i><i></i>
                </div>
              </div>
            </section>

            <!-- 4. 今日目录 Feed -->
            <section class="feed" id="catalogSection" aria-label="今日目录">
              <div class="feed__head">
                <h2 class="feed__title">今日目录</h2>
                <div class="chips" role="tablist" aria-label="筛选文章类型">
                  <button class="chip is-active" type="button" data-filter="all">全部</button>
                  <button class="chip" type="button" data-filter="report">长报道</button>
                  <button class="chip" type="button" data-filter="essay">随笔</button>
                  <button class="chip" type="button" data-filter="interview">访谈</button>
                </div>
              </div>
              <ul class="feed__list" id="feedList">
                <li class="feed-item" data-kind="report">
                  <span class="feed-item__glyph" aria-hidden="true">📮</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">深夜机场的摆渡人</span>
                    <span class="feed-item__meta">长报道 · 12 分钟 <em class="feed-item__chip">连载中</em></span>
                  </div>
                  <button class="feed-item__star" type="button" aria-label="加入书单" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="essay">
                  <span class="feed-item__glyph" aria-hidden="true">🍳</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">把厨房当作书房的人</span>
                    <span class="feed-item__meta">随笔 · 6 分钟</span>
                  </div>
                  <button class="feed-item__star" type="button" aria-label="加入书单" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="interview">
                  <span class="feed-item__glyph" aria-hidden="true">📚</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">对话修复古籍的装帧师</span>
                    <span class="feed-item__meta">访谈 · 15 分钟 <em class="feed-item__chip feed-item__chip--gift">限免</em></span>
                  </div>
                  <button class="feed-item__star" type="button" aria-label="加入书单" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="report">
                  <span class="feed-item__glyph" aria-hidden="true">☕</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">小城咖啡馆经济学</span>
                    <span class="feed-item__meta">长报道 · 9 分钟</span>
                  </div>
                  <button class="feed-item__star" type="button" aria-label="加入书单" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="essay">
                  <span class="feed-item__glyph" aria-hidden="true">🌙</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">走神是心灵的深呼吸</span>
                    <span class="feed-item__meta">随笔 · 4 分钟</span>
                  </div>
                  <button class="feed-item__star" type="button" aria-label="加入书单" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                    </svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 5. 操作区 -->
            <section class="action-area" aria-label="写批注">
              <input class="note-input" id="noteInput" type="text" placeholder="写一句批注，存进批注本……" />
              <div class="action-row">
                <button class="btn-primary" type="button" id="shelfBtn">本期全部加入书单</button>
                <button class="btn-sand" type="button" data-toast="摘要已生成：本期 4 篇，预计 18 分钟读完">本期摘要</button>
              </div>
            </section>
          </main>

          <!-- 6. 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tabbar__item" type="button" data-tab="书架">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
              <span>书架</span>
            </button>
            <button class="tabbar__item is-active" type="button" data-tab="今日">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
              <span>今日</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="收藏" aria-label="收藏本期">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>收藏</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="笔记">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
              </svg>
              <span>笔记</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="我的">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5" />
              </svg>
              <span>我的</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
