<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>喵语学堂 · Duolingo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" />
              </svg>
              <svg
                class="status-bar__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0"
                />
              </svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 1. 顶部品牌栏 -->
            <header class="brand-bar">
              <div class="brand-bar__mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none">
                  <path d="M8 7 5 3.5c-.8-.9-2.2.1-1.6 1.2L6 10c-1.2 1.6-1.9 3.6-1.9 5.8C4.1 22 9.6 27 16 27s11.9-5 11.9-11.2c0-2.2-.7-4.2-1.9-5.8l2.6-5.3c.6-1.1-.8-2.1-1.6-1.2L24 7c-2.2-1.6-5-2.5-8-2.5S10.2 5.4 8 7z" fill="var(--accent)" stroke="var(--fg)" stroke-width="1.6"/>
                  <circle cx="11.5" cy="15" r="3" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.4"/>
                  <circle cx="20.5" cy="15" r="3" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.4"/>
                  <circle cx="12.2" cy="15.4" r="1.2" fill="var(--fg)"/>
                  <circle cx="21.2" cy="15.4" r="1.2" fill="var(--fg)"/>
                  <path d="M14 20.4q2 1.8 4 0" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="brand-bar__text">
                <span class="brand-bar__name">喵语学堂</span>
                <span class="brand-bar__sub">日语 · 第 2 单元 · 打招呼</span>
              </div>
              <button class="brand-bar__icon brand-bar__icon--streak" type="button" data-toast="连续打卡 12 天！明天也要来哦" aria-label="连续打卡 12 天">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22c4.4 0 7-2.8 7-6.5 0-2.5-1.3-4-2.5-5.5C15.2 8.3 14.5 6.5 14.5 4c-3 1.5-4.6 3.8-4.6 6.2 0 .8.1 1.4.2 1.9-1.2-.2-2.2-1-2.8-2.2C5.9 11.3 5 13.2 5 15.5 5 19.2 7.6 22 12 22z" fill="var(--warn)" />
                </svg>
                <b>12</b>
              </button>
            </header>

            <!-- 2. Hero / 签名卡：技能树 + XP 进度 -->
            <section class="lesson-card" aria-label="今日课程">
              <div class="lesson-card__head">
                <h1 class="lesson-card__title">第 2 单元 · 打招呼</h1>
                <span class="lesson-card__xp" id="xpBadge">50 XP</span>
              </div>
              <div class="lesson-card__tree" role="list" aria-label="课程技能树">
                <div class="bubble is-done" role="listitem" aria-label="第一课已完成">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 13l4 4L19 7" />
                  </svg>
                  <span class="bubble__label">你好</span>
                </div>
                <i class="bubble-link is-done" aria-hidden="true"></i>
                <button class="bubble is-current" type="button" id="currentBubble" aria-label="第二课，当前课程，点击闯关">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20V10M12 6.5V4" />
                  </svg>
                  <span class="bubble__label">谢谢</span>
                </button>
                <i class="bubble-link" aria-hidden="true"></i>
                <div class="bubble is-locked" role="listitem" aria-label="第三课，未解锁">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5.5" y="10.5" width="13" height="9" rx="2.5" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
                  </svg>
                  <span class="bubble__label">再见</span>
                </div>
              </div>
              <div class="xpbar" role="progressbar" aria-label="每日目标进度" aria-valuemin="0" aria-valuemax="80" aria-valuenow="50" id="xpBar">
                <span class="xpbar__fill" id="xpFill" style="--w: 62%"></span>
                <b class="xpbar__num" id="xpNum">50 / 80 XP</b>
              </div>
              <div class="lesson-card__actions">
                <button class="btn-chunky-green" type="button" id="startBtn">继续闯关</button>
                <button class="btn-chunky-white" type="button" data-toast="提示：ありがとう 的重点是「り」发短音">看提示</button>
              </div>
            </section>

            <!-- 3. 两张内容卡 -->
            <section class="duo-grid" aria-label="每日目标与宝石">
              <div class="duo-card">
                <h2 class="duo-card__title">每日目标</h2>
                <p class="duo-card__num">62<span>%</span></p>
                <p class="duo-card__note">再得 30 XP 就能保住火苗</p>
                <div class="goal-dots" aria-hidden="true">
                  <i class="is-done"></i><i class="is-done"></i><i class="is-done"></i><i></i><i></i>
                </div>
              </div>
              <div class="duo-card">
                <h2 class="duo-card__title">喵宝石</h2>
                <p class="duo-card__num gem">486<span> 颗</span></p>
                <p class="duo-card__note">本周榜单第 3 名 · 距第 2 还差 40 XP</p>
                <div class="goal-dots" aria-hidden="true">
                  <i class="rank"></i><i class="rank"></i><i class="rank is-done"></i>
                </div>
              </div>
            </section>

            <!-- 4. 单词本 Feed -->
            <section class="feed" aria-label="单词本">
              <div class="feed__head">
                <h2 class="feed__title">我的单词本</h2>
                <div class="chips" role="tablist" aria-label="筛选单词">
                  <button class="chip is-active" type="button" data-filter="all">全部</button>
                  <button class="chip" type="button" data-filter="mastered">已掌握</button>
                  <button class="chip" type="button" data-filter="learning">巩固中</button>
                  <button class="chip" type="button" data-filter="new">新词</button>
                </div>
              </div>
              <ul class="feed__list" id="feedList">
                <li class="feed-item" data-kind="mastered">
                  <span class="feed-item__glyph" aria-hidden="true">は</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">はじめまして</span>
                    <span class="feed-item__meta">初次见面 <em class="feed-item__chip" data-level="mastered">已掌握</em></span>
                  </div>
                  <button class="feed-item__heart is-on" type="button" aria-label="收藏" aria-pressed="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.4 1 4.4 2.4h2.2C14.1 6 15.5 5 17.5 5 21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9Z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="learning">
                  <span class="feed-item__glyph" aria-hidden="true">あ</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">ありがとう</span>
                    <span class="feed-item__meta">谢谢 <em class="feed-item__chip" data-level="learning">巩固中</em></span>
                  </div>
                  <button class="feed-item__heart" type="button" aria-label="收藏" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.4 1 4.4 2.4h2.2C14.1 6 15.5 5 17.5 5 21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9Z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="new">
                  <span class="feed-item__glyph" aria-hidden="true">さ</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">さようなら</span>
                    <span class="feed-item__meta">再见 <em class="feed-item__chip" data-level="new">新词</em></span>
                  </div>
                  <button class="feed-item__heart" type="button" aria-label="收藏" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.4 1 4.4 2.4h2.2C14.1 6 15.5 5 17.5 5 21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9Z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="mastered">
                  <span class="feed-item__glyph" aria-hidden="true">お</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">おはよう</span>
                    <span class="feed-item__meta">早上好 <em class="feed-item__chip" data-level="mastered">已掌握</em></span>
                  </div>
                  <button class="feed-item__heart" type="button" aria-label="收藏" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.4 1 4.4 2.4h2.2C14.1 6 15.5 5 17.5 5 21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9Z" />
                    </svg>
                  </button>
                </li>
                <li class="feed-item" data-kind="learning">
                  <span class="feed-item__glyph" aria-hidden="true">す</span>
                  <div class="feed-item__body">
                    <span class="feed-item__name">すみません</span>
                    <span class="feed-item__meta">不好意思 <em class="feed-item__chip" data-level="learning">巩固中</em></span>
                  </div>
                  <button class="feed-item__heart" type="button" aria-label="收藏" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                      <path d="M12 21s-7.5-4.7-9.5-9C1 8.5 3 5 6.5 5c2 0 3.4 1 4.4 2.4h2.2C14.1 6 15.5 5 17.5 5 21 5 23 8.5 21.5 12c-2 4.3-9.5 9-9.5 9Z" />
                    </svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 5. 操作区 -->
            <section class="action-area" aria-label="记录新词">
              <input class="word-input" id="wordInput" type="text" placeholder="记一个今天学到的词，如：いただきます" />
              <div class="action-row">
                <button class="btn-chunky-green" type="button" id="addBtn">加进单词本</button>
                <button class="btn-chunky-white" type="button" data-toast="已生成 8 词小测，随时开始">测一测</button>
              </div>
            </section>
          </main>

          <!-- 6. 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tabbar__item is-active" type="button" data-tab="学习">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /><path d="M15 3v5h5M9 13h6M9 17h4" />
              </svg>
              <span>学习</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="单词">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19V5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2z" /><path d="M13 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5" />
              </svg>
              <span>单词</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="闯关" aria-label="闯关">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>闯关</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="榜单">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 21V13M12 21V3M19 21V9" />
              </svg>
              <span>榜单</span>
            </button>
            <button class="tabbar__item" type="button" data-tab="我的">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.5" r="3.5" /><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5" />
              </svg>
              <span>我的</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
