<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播间管理 - 示例工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.8 17 12l-8.5 5.2V6.8Z"/></svg></span>
        <strong class="brand-name">示例工作台</strong>
      </div>
      <nav class="side-menu" aria-label="主导航">
        <div class="side-section">
          <h3 class="side-section-title">直播管理</h3>
          <button class="side-menu-item is-active" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
            <span class="side-text">直播间管理</span>
          </button>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg></span>
            <span class="side-text">直播审核</span>
          </button>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg></span>
            <span class="side-text">数据门户</span>
          </button>
        </div>
        <div class="side-section">
          <h3 class="side-section-title">内容管理</h3>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg></span>
            <span class="side-text">点播管理</span>
          </button>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg></span>
            <span class="side-text">视频广场</span>
          </button>
        </div>
        <div class="side-section">
          <h3 class="side-section-title">运营管理</h3>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>
            <span class="side-text">业务员管理</span>
          </button>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 15h3"/></svg></span>
            <span class="side-text">账户中心</span>
          </button>
          <button class="side-menu-item" type="button">
            <span class="side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.1A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.38.35.72.65.98.3.26.68.4 1.08.42H21v4h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg></span>
            <span class="side-text">基本设置</span>
          </button>
        </div>
      </nav>
      <!-- 收起触发器 -->
      <button class="collapse-trigger" id="collapseTrigger" type="button" aria-label="收起侧边栏">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path id="chevronPath" d="M6.5 2L3.5 5L6.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <header class="header">
        <div class="header-left">
          <h1 class="header-title">直播间管理</h1>
        </div>
        <div class="header-right">
          <button class="icon-btn" type="button" aria-label="帮助文档"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.5 2.14c-.8.42-1.3 1.08-1.3 1.86M12 17h.01"/></svg></button>
          <button class="icon-btn" type="button" aria-label="消息通知">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5a4 4 0 0 0-4 4v2.5l-1.2 2h10.4L12 8V5.5a4 4 0 0 0-4-4Zm0 13a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2Z" fill="currentColor"/></svg>
          </button>
          <div class="user-actions">
            <span class="avatar">管</span>
            <span class="user-name">管理员</span>
          </div>
        </div>
      </header>

      <div class="content">
        <!-- 页面标题区 -->
        <div class="page-header">
          <div class="page-title-main">
            <h2 class="page-title">直播间列表</h2>
            <span class="page-title-suffix">管理所有直播间的创建、编辑与下线</span>
          </div>
          <div class="page-header-extra">
            <span class="header-stat">直播中 <strong id="statLiving">0</strong> 场</span>
            <span class="header-stat">未开始 <strong id="statPending">0</strong> 场</span>
            <button class="btn btn-primary" id="btnCreate" type="button">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              新建直播间
            </button>
          </div>
        </div>

        <!-- 搜索筛选卡 -->
        <div class="card search-card">
          <div class="filter-row">
            <div class="form-item">
              <label>直播间名称</label>
              <input type="text" class="form-input" id="searchName" placeholder="请输入直播间名称" />
            </div>
            <div class="form-item">
              <label>主播</label>
              <input type="text" class="form-input" id="searchAnchor" placeholder="请输入主播姓名" />
            </div>
            <div class="form-item">
              <label>状态</label>
              <select class="form-input form-select" id="searchStatus">
                <option value="">全部状态</option>
                <option value="pending">未开始</option>
                <option value="living">直播中</option>
                <option value="ended">已结束</option>
                <option value="disabled">已禁用</option>
              </select>
            </div>
            <div class="form-item">
              <label>直播平台</label>
              <select class="form-input form-select" id="searchPlatform">
                <option value="">全部平台</option>
                <option value="wechat">微信视频号</option>
                <option value="douyin">抖音</option>
                <option value="xiaohongshu">小红书</option>
                <option value="custom">自定义推流</option>
              </select>
            </div>
            <div class="filter-actions">
              <button class="btn btn-primary" id="btnSearch" type="button">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                查询
              </button>
              <button class="btn btn-default" id="btnReset" type="button">重置</button>
            </div>
          </div>
        </div>

        <!-- 表格卡 -->
        <div class="card table-card">
          <div class="table-toolbar">
            <div class="toolbar-left">
              <h3 class="table-title">全部直播间</h3>
              <span class="table-count" id="tableCount">共 0 条</span>
            </div>
            <div class="toolbar-right">
              <button class="btn btn-default btn-sm" id="btnRefresh" type="button">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 7a5 5 0 1 1-1.46-3.54M12 2v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                刷新
              </button>
            </div>
          </div>
          <!-- 批量操作提示条 -->
          <div class="batch-bar" id="batchBar">
            <span class="batch-text">已选择 <strong id="batchCount">0</strong> 项</span>
            <button class="btn-link btn-link-danger" id="btnBatchDelete" type="button">批量删除</button>
            <button class="btn-link" id="btnBatchClear" type="button">清空选择</button>
          </div>

          <div class="table-wrapper">
            <table class="table" id="roomTable">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="checkAll" aria-label="全选" /></th>
                  <th class="col-id">直播间ID</th>
                  <th class="col-name">直播间名称</th>
                  <th class="col-anchor">主播</th>
                  <th class="col-platform">直播平台</th>
                  <th class="col-status">状态</th>
                  <th class="col-viewers">累计观看</th>
                  <th class="col-time">计划开始时间</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="roomTableBody">
                <!-- 动态渲染 -->
              </tbody>
            </table>
          </div>

          <!-- 分页 -->
          <div class="pagination" id="pagination">
            <span class="page-total">共 <strong id="pageTotal">0</strong> 条</span>
            <select class="page-size" id="pageSize">
              <option value="10">10 条/页</option>
              <option value="20">20 条/页</option>
              <option value="50">50 条/页</option>
            </select>
            <div class="page-buttons" id="pageButtons"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- 新建/编辑 Modal -->
    <div class="modal-mask" id="roomModal" aria-hidden="true">
      <div class="modal">
        <div class="modal-head">
          <h3 id="modalTitle">新建直播间</h3>
          <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <form id="roomForm" class="modal-form">
            <input type="hidden" id="formId" />
            <div class="form-grid">
              <div class="modal-form-item modal-form-item-full">
                <label class="form-label required">直播间名称</label>
                <input type="text" class="form-input form-input-block" id="formName" placeholder="请输入直播间名称（最多 30 字）" maxlength="30" />
                <span class="form-error" id="errName"></span>
              </div>
              <div class="modal-form-item">
                <label class="form-label required">主播</label>
                <input type="text" class="form-input form-input-block" id="formAnchor" placeholder="请输入主播姓名" />
                <span class="form-error" id="errAnchor"></span>
              </div>
              <div class="modal-form-item">
                <label class="form-label required">直播平台</label>
                <select class="form-input form-input-block form-select" id="formPlatform">
                  <option value="">请选择直播平台</option>
                  <option value="wechat">微信视频号</option>
                  <option value="douyin">抖音</option>
                  <option value="xiaohongshu">小红书</option>
                  <option value="custom">自定义推流</option>
                </select>
                <span class="form-error" id="errPlatform"></span>
              </div>
              <div class="modal-form-item">
                <label class="form-label required">计划开始时间</label>
                <input type="datetime-local" class="form-input form-input-block" id="formStartTime" />
                <span class="form-error" id="errStartTime"></span>
              </div>
              <div class="modal-form-item">
                <label class="form-label">预计时长（分钟）</label>
                <input type="number" class="form-input form-input-block" id="formDuration" placeholder="如 120" min="1" />
              </div>
              <div class="modal-form-item modal-form-item-full">
                <label class="form-label">直播间简介</label>
                <textarea class="form-textarea" id="formDesc" placeholder="请输入直播间简介（选填，最多 200 字）" maxlength="200" rows="3"></textarea>
              </div>
              <div class="modal-form-item modal-form-item-full">
                <label class="form-label">推流地址</label>
                <input type="text" class="form-input form-input-block" id="formPushUrl" placeholder="rtmp://（选填，自定义推流平台使用）" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button class="btn btn-default" id="modalCancel" type="button">取消</button>
          <button class="btn btn-primary" id="modalSubmit" type="button">确定</button>
        </div>
      </div>
    </div>

    <!-- 删除确认 Modal -->
    <div class="modal-mask" id="deleteModal" aria-hidden="true">
      <div class="modal modal-confirm">
        <div class="modal-head">
          <h3>确认删除</h3>
          <button class="modal-close" id="deleteClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="confirm-content">
            <span class="confirm-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.2 2.6 18a2 2 0 0 0 1.74 3h15.32a2 2 0 0 0 1.74-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span>
            <p id="deleteTip">确定要删除该直播间吗？删除后不可恢复，关联的观看数据将被保留但无法再进入该直播间。</p>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-default" id="deleteCancel" type="button">取消</button>
          <button class="btn btn-danger" id="deleteConfirm" type="button">确认删除</button>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
