<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业控制台 · Arco React</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Arco Design 全局样式（本地 vendor，离线可用） -->
  <link rel="stylesheet" href="./vendor/arco.css" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- 运行时依赖（本地 vendor UMD，提供 window.React / window.ReactDOM / window.arco） -->
  <script src="./vendor/react.js"></script>
  <script src="./vendor/react-dom.js"></script>
  <script src="./vendor/arco.js"></script>

  <!-- App（已预编译为 React.createElement，无需运行时 Babel） -->
  <script src="./app.js"></script>
</body>
</html>
