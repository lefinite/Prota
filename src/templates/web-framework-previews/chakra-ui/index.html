<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业控制台 · Chakra Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="ck-app">
      <!-- ============ 侧边导航 ============ -->
      <aside class="ck-sidebar" id="sidebar">
        <div class="ck-brand">
          <div class="ck-brand-mark">H</div>
          <div class="ck-brand-text">
            <span class="ck-brand-name">Demo Studio 控制台</span>
            <span class="ck-brand-sub">示例工作台 · 企业版</span>
          </div>
        </div>

        <nav class="ck-nav" id="nav">
          <a class="ck-nav-item is-active" data-view="overview" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
            <span>概览</span>
          </a>
          <a class="ck-nav-item" data-view="members" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5Z"/></svg>
            <span>业务员管理</span>
          </a>
          <a class="ck-nav-item" data-view="live" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
            <span>直播管理</span>
          </a>
          <a class="ck-nav-item" data-view="review" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M12 2 4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3Zm-2 16-4-4 1.41-1.41L10 15.17l6.59-6.59L18 10l-8 8Z"/></svg>
            <span>审核中心</span>
          </a>
          <a class="ck-nav-item" data-view="data" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2ZM9 17H7v-7h2v7Zm4 0h-2V7h2v10Zm4 0h-2v-4h2v4Z"/></svg>
            <span>数据中心</span>
          </a>
          <a class="ck-nav-item" data-view="settings" href="#">
            <svg viewBox="0 0 24 24" class="ck-icon" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/></svg>
            <span>系统设置</span>
          </a>
        </nav>

        <div class="ck-side-foot">
          <div class="ck-side-card">
            <div class="ck-side-card-row">
              <span class="ck-dot ck-dot-accent"></span>
              <span class="ck-side-card-label">服务状态</span>
            </div>
            <div class="ck-side-card-value">运行正常</div>
          </div>
        </div>
      </aside>

      <!-- ============ 主区域 ============ -->
      <div class="ck-main">
        <!-- 顶栏 -->
        <header class="ck-topbar">
          <button class="ck-icon-btn ck-only-mobile" id="menuToggle" aria-label="切换菜单">
            <svg viewBox="0 0 24 24" class="ck-icon"><path d="M3 18h18v-2H3v2Zm0-5h18v-2H3v2Zm0-7v2h18V6H3Z"/></svg>
          </button>

          <div class="ck-search">
            <svg viewBox="0 0 24 24" class="ck-icon ck-search-icon" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
            <input type="text" id="globalSearch" placeholder="搜索业务员、直播间、订单…" />
            <kbd class="ck-kbd">⌘K</kbd>
          </div>

          <div class="ck-top-actions">
            <button class="ck-icon-btn" aria-label="通知">
              <svg viewBox="0 0 24 24" class="ck-icon"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2Zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg>
              <span class="ck-badge-dot"></span>
            </button>
            <button class="ck-icon-btn" aria-label="帮助">
              <svg viewBox="0 0 24 24" class="ck-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm1 17h-2v-2h2v2Zm2.07-7.75-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41a2 2 0 0 0-4 0H8a4 4 0 0 1 8 0c0 .88-.36 1.68-.93 2.25Z"/></svg>
            </button>
            <div class="ck-user">
              <div class="ck-avatar">陈</div>
              <div class="ck-user-meta ck-hide-sm">
                <span class="ck-user-name">陈雨晴</span>
                <span class="ck-user-role">超级管理员</span>
              </div>
            </div>
          </div>
        </header>

        <!-- 内容滚动区 -->
        <main class="ck-content" id="content"><!-- 由 app.js 渲染 --></main>
      </div>

      <!-- 抽屉/弹层容器 -->
      <div class="ck-overlay" id="overlay" hidden></div>
      <!-- Toast -->
      <div class="ck-toast-wrap" id="toastWrap" aria-live="polite"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
