<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据中心 - 示例工作台控制台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="el-app">
      <!-- el-aside: 侧边菜单 -->
      <aside class="el-aside" id="aside">
        <div class="aside-logo">
          <span class="logo-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5V7Z"/></svg></span>
          <span class="logo-text">示例工作台</span>
        </div>
        <nav class="el-menu" aria-label="主导航">
          <div class="menu-group-title">直播管理</div>
          <button class="el-menu-item" type="button" data-menu="live-room">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
            <span class="menu-text">直播间管理</span>
          </button>
          <button class="el-menu-item" type="button" data-menu="live-audit">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg></span>
            <span class="menu-text">直播审核</span>
          </button>
          <button class="el-menu-item is-active" type="button" data-menu="data-center">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg></span>
            <span class="menu-text">数据中心</span>
          </button>
          <div class="menu-group-title">内容管理</div>
          <button class="el-menu-item" type="button" data-menu="vod">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg></span>
            <span class="menu-text">点播管理</span>
          </button>
          <button class="el-menu-item" type="button" data-menu="video-square">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg></span>
            <span class="menu-text">视频广场</span>
          </button>
          <div class="menu-group-title">运营管理</div>
          <button class="el-menu-item" type="button" data-menu="anchor">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span>
            <span class="menu-text">主播管理</span>
          </button>
          <button class="el-menu-item" type="button" data-menu="account">
            <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></span>
            <span class="menu-text">系统设置</span>
          </button>
        </nav>
      </aside>

      <!-- el-container: 主区域 -->
      <div class="el-container">
        <!-- el-header -->
        <header class="el-header">
          <div class="header-left">
            <button class="collapse-btn" id="collapseBtn" type="button" aria-label="收起菜单">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <!-- el-breadcrumb -->
            <nav class="el-breadcrumb" aria-label="面包屑">
              <span class="breadcrumb-item">直播管理</span>
              <span class="breadcrumb-sep">/</span>
              <span class="breadcrumb-item is-current">数据中心</span>
            </nav>
          </div>
          <div class="header-right">
            <button class="header-action" type="button" data-action="search" aria-label="搜索">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="header-action" type="button" data-action="fullscreen" aria-label="全屏">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="header-action has-badge" type="button" data-action="notify" aria-label="通知">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 21a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span class="el-badge-dot"></span>
            </button>
            <div class="header-divider"></div>
            <div class="header-user">
              <span class="el-avatar">管</span>
              <span class="user-name">管理员</span>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="color:var(--el-text-color-secondary)"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </header>

        <!-- el-main -->
        <main class="el-main">
          <!-- 页面头部 -->
          <div class="page-header">
            <div class="page-header-left">
              <h2 class="page-title">业务概览</h2>
              <span class="page-subtitle">企业直播全链路数据汇总 · 数据每 5 分钟同步更新</span>
            </div>
            <div class="page-header-right">
              <!-- el-radio-group: 时间范围 -->
              <div class="el-radio-group" id="rangeGroup" role="radiogroup" aria-label="时间范围">
                <button class="el-radio-button" data-range="today" role="radio" type="button">今日</button>
                <button class="el-radio-button is-active" data-range="7d" role="radio" aria-checked="true" type="button">近 7 天</button>
                <button class="el-radio-button" data-range="30d" role="radio" type="button">近 30 天</button>
                <button class="el-radio-button" data-range="90d" role="radio" type="button">近 90 天</button>
              </div>
              <!-- el-button -->
              <button class="el-button el-button--default el-button--small" id="btnExport" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>导出报表</span>
              </button>
            </div>
          </div>

          <!-- 核心指标卡 row -->
          <div class="stat-row" id="statRow">
            <!-- 动态渲染 -->
          </div>

          <!-- 图表区域 -->
          <div class="chart-section">
            <!-- 主趋势图 -->
            <div class="el-card chart-card chart-main">
              <div class="el-card__header">
                <div class="card-title-group">
                  <h3 class="card-title">直播观看趋势</h3>
                  <span class="card-subtitle" id="trendSubtitle">近 7 天每日累计观看与独立观众</span>
                </div>
                <div class="chart-legend">
                  <span class="legend-item"><span class="legend-dot" style="background:#409eff"></span>累计观看</span>
                  <span class="legend-item"><span class="legend-dot legend-dot-dashed" style="border-color:#67c23a"></span>独立观众</span>
                </div>
              </div>
              <div class="el-card__body">
                <div class="chart-canvas" id="trendChart"></div>
              </div>
            </div>

            <!-- 平台分布饼图 -->
            <div class="el-card chart-card chart-side">
              <div class="el-card__header">
                <div class="card-title-group">
                  <h3 class="card-title">平台分布</h3>
                  <span class="card-subtitle">各直播平台场次占比</span>
                </div>
              </div>
              <div class="el-card__body">
                <div class="pie-wrap">
                  <div class="chart-canvas pie-canvas" id="pieChart"></div>
                  <div class="pie-legend" id="pieLegend"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 平台趋势对比 -->
          <div class="el-card">
            <div class="el-card__header">
              <div class="card-title-group">
                <h3 class="card-title">平台观看趋势对比</h3>
                <span class="card-subtitle">各大平台累计观看分日趋势</span>
              </div>
              <div class="chart-legend">
                <span class="legend-item"><span class="legend-dot" style="background:#409eff"></span>微信视频号</span>
                <span class="legend-item"><span class="legend-dot" style="background:#e6a23c"></span>抖音</span>
                <span class="legend-item"><span class="legend-dot" style="background:#f56c6c"></span>小红书</span>
                <span class="legend-item"><span class="legend-dot" style="background:#67c23a"></span>自定义推流</span>
              </div>
            </div>
            <div class="el-card__body">
              <div class="chart-canvas chart-tall" id="platformChart"></div>
            </div>
          </div>

          <!-- 直播间 TOP 榜 -->
          <div class="el-card table-card">
            <div class="el-card__header">
              <div class="card-title-group">
                <h3 class="card-title">直播间观看榜 TOP 10</h3>
                <span class="el-tag el-tag--info el-tag--small">共 10 条</span>
              </div>
              <div class="table-toolbar-actions">
                <div class="el-input el-input--small table-search">
                  <svg class="el-input__prefix" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  <input type="text" placeholder="搜索直播间 / 主播" id="tableSearch" />
                </div>
                <button class="el-button el-button--default el-button--small" id="btnRefresh" type="button">
                  <svg class="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <span>刷新</span>
                </button>
              </div>
            </div>
            <div class="el-card__body table-body">
              <div class="el-table-wrapper">
                <table class="el-table" id="rankTable">
                  <thead>
                    <tr>
                      <th class="col-rank">排名</th>
                      <th class="col-name">直播间名称</th>
                      <th class="col-anchor">主播</th>
                      <th class="col-platform">平台</th>
                      <th class="col-status">状态</th>
                      <th class="col-num">累计观看</th>
                      <th class="col-num">独立观众</th>
                      <th class="col-num">互动次数</th>
                      <th class="col-duration">直播时长</th>
                    </tr>
                  </thead>
                  <tbody id="rankTableBody">
                    <!-- 动态渲染 -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- el-message -->
    <div class="el-message-wrap" id="messageWrap"></div>

    <script src="./app.js"></script>
  </body>
</html>
