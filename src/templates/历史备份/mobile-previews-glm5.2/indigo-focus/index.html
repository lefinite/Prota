<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>FlowSync · Indigo Focus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏：靛蓝渐变 logo -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">
                  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="16" cy="16" r="12"/>
                    <path d="M16 8v8l4 4"/>
                  </svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">FlowSync</span>
                  <span class="brand-sub">早安，Ping</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="通知" data-toast="暂无新通知">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" /></svg>
                <span class="iconbtn__dot" aria-hidden="true"></span>
              </button>
            </header>

            <!-- Hero Card：靛蓝柔光效果（signature） -->
            <section class="hero-card" aria-label="今日专注">
              <div class="hero-card__glow" aria-hidden="true"></div>
              <p class="hero-card__label">今日专注时间</p>
              <p class="hero-card__value"><span class="hero-card__num">4.5</span> <span class="hero-card__unit">小时</span></p>
              <div class="hero-card__meta">
                <span class="hero-card__stat">完成 8 个任务</span>
                <span class="hero-card__stat">效率 +12%</span>
              </div>
              <div class="hero-card__ring" aria-hidden="true">
                <svg class="ring-svg" viewBox="0 0 100 100">
                  <circle class="ring-bg" cx="50" cy="50" r="42"/>
                  <circle class="ring-fill" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="33"/>
                </svg>
                <div class="ring-label">75%</div>
              </div>
              <div class="hero-card__actions">
                <button class="btn btn--primary" data-toast="开始专注">
                  <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                  开始专注
                </button>
                <button class="btn btn--secondary" data-toast="查看统计">统计</button>
              </div>
            </section>

            <!-- 双卡片：圆润 12px radius -->
            <section class="stat-row" aria-label="本周概览">
              <div class="stat-card">
                <div class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </div>
                <span class="stat-card__val">24</span>
                <span class="stat-card__cap">已完成</span>
              </div>
              <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--pending">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
                </div>
                <span class="stat-card__val">6</span>
                <span class="stat-card__cap">进行中</span>
              </div>
            </section>

            <!-- 任务列表：柔和卡片风格 -->
            <section class="list-block" aria-label="任务列表">
              <div class="list-block__head">
                <h2>今日任务</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选任务">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="active" role="tab" aria-selected="false">进行中</button>
                  <button class="chip" data-filter="done" role="tab" aria-selected="false">已完成</button>
                </div>
              </div>

              <ul class="task-list" id="taskList">
                <li class="task" data-state="active">
                  <span class="task__check">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">完成产品原型设计</span>
                    <span class="task__sub">下午 3:00 · 设计</span>
                  </div>
                  <div class="task__right">
                    <span class="task__priority task__priority--high">高</span>
                  </div>
                </li>
                <li class="task" data-state="done">
                  <span class="task__check task__check--checked">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title task__title--done">团队周会</span>
                    <span class="task__sub">上午 10:00 · 会议</span>
                  </div>
                  <div class="task__right">
                    <span class="task__priority task__priority--done">完成</span>
                  </div>
                </li>
                <li class="task" data-state="active">
                  <span class="task__check">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">代码审查</span>
                    <span class="task__sub">下午 5:00 · 开发</span>
                  </div>
                  <div class="task__right">
                    <span class="task__priority task__priority--normal">中</span>
                  </div>
                </li>
                <li class="task" data-state="active">
                  <span class="task__check">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">更新用户文档</span>
                    <span class="task__sub">明天 10:00 · 文档</span>
                  </div>
                  <div class="task__right">
                    <span class="task__priority task__priority--normal">中</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 快速添加：圆润输入框 -->
            <section class="quick-add" aria-label="快速添加">
              <input type="text" class="quick-input" placeholder="添加新任务..." aria-label="新任务">
              <button class="btn btn--icon" aria-label="添加">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab：圆润 12px -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>日历</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="添加">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="tab" data-tab="analytics">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 21H4.6a.6.6 0 0 1-.6-.6V4"/><path d="M12 12l5-5"/><path d="M12 17V7"/></svg>
              <span>统计</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
