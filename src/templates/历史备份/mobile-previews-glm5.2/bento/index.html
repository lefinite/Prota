<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BentoBoard · Bento</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="demo-stage">
    <div class="phone-shell">
      <div class="phone-screen" id="phoneScreen">
        <div class="status-bar" aria-label="设备状态栏">
          <span class="status-bar__time" id="statusTime">9:41</span>
          <div class="status-bar__island" aria-hidden="true"></div>
          <div class="status-bar__right" aria-hidden="true">
            <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
            <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
            <span class="battery"></span>
          </div>
        </div>

        <main class="app-content" id="appContent">
          <!-- 顶部品牌栏 -->
          <header class="topbar">
            <div class="topbar__brand">
              <span class="brand-mark">B</span>
              <div class="brand-text">
                <span class="brand-name">BentoBoard</span>
                <span class="brand-sub">早安，Ping</span>
              </div>
            </div>
            <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>
          </header>

          <!-- Bento Grid 主区域（signature：模块化卡片网格） -->
          <section class="bento-grid" aria-label="今日概览">
            <!-- 大卡片：天气 -->
            <article class="bento-card bento-card--weather">
              <div class="weather-main">
                <span class="weather-icon">☀️</span>
                <div class="weather-temp">
                  <span class="weather-temp__val">26°</span>
                  <span class="weather-temp__hint">晴朗</span>
                </div>
              </div>
              <div class="weather-meta">
                <span>上海</span>
                <span>湿度 45%</span>
              </div>
            </article>

            <!-- 卡片：任务进度 -->
            <article class="bento-card bento-card--tasks">
              <span class="bento-card__cap">今日任务</span>
              <span class="bento-card__val">8/12</span>
              <div class="bento-card__progress" style="--p: 66%"></div>
              <span class="bento-card__foot">还有 4 项待完成</span>
            </article>

            <!-- 卡片：专注时间 -->
            <article class="bento-card bento-card--focus">
              <span class="bento-card__cap">专注时长</span>
              <span class="bento-card__val">4.2h</span>
              <span class="bento-card__foot trend--up">↑ 18% 较昨日</span>
            </article>

            <!-- 卡片：支出 -->
            <article class="bento-card bento-card--spend">
              <span class="bento-card__cap">今日支出</span>
              <span class="bento-card__val">¥128</span>
              <span class="bento-card__foot trend--down">↓ 12% 较昨日</span>
            </article>

            <!-- 宽卡片：快捷操作 -->
            <article class="bento-card bento-card--actions">
              <span class="bento-card__cap">快捷操作</span>
              <div class="action-grid">
                <button class="action-item" data-toast="新建笔记">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
                  <span>笔记</span>
                </button>
                <button class="action-item" data-toast="添加任务">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 12h6M12 9v6"/></svg>
                  <span>任务</span>
                </button>
                <button class="action-item" data-toast="打开日历">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                  <span>日历</span>
                </button>
                <button class="action-item" data-toast="更多功能">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                  <span>更多</span>
                </button>
              </div>
            </article>

            <!-- 卡片：步数 -->
            <article class="bento-card bento-card--steps">
              <span class="bento-card__cap">步数</span>
              <span class="bento-card__val">8,432</span>
              <span class="bento-card__foot">目标 10,000</span>
            </article>

            <!-- 卡片：饮水 -->
            <article class="bento-card bento-card--water">
              <span class="bento-card__cap">饮水</span>
              <span class="bento-card__val">1.2L</span>
              <span class="bento-card__foot">目标 2L</span>
            </article>
          </section>

          <!-- Widget 列表 -->
          <section class="widget-section" aria-label="我的组件">
            <div class="section-header">
              <h2>我的组件</h2>
              <button class="chip-add" data-toast="添加组件">+</button>
            </div>
            <ul class="widget-list">
              <li class="widget-item" data-toast="打开番茄钟">
                <span class="widget-icon widget-icon--pomodoro">🍅</span>
                <div class="widget-main">
                  <span class="widget-title">番茄钟</span>
                  <span class="widget-sub">今日已完成 4 个</span>
                </div>
                <svg class="widget-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </li>
              <li class="widget-item" data-toast="打开习惯追踪">
                <span class="widget-icon widget-icon--habit">✓</span>
                <div class="widget-main">
                  <span class="widget-title">习惯追踪</span>
                  <span class="widget-sub">连续打卡 21 天</span>
                </div>
                <svg class="widget-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </li>
              <li class="widget-item" data-toast="打开阅读记录">
                <span class="widget-icon widget-icon--read">📖</span>
                <div class="widget-main">
                  <span class="widget-title">阅读记录</span>
                  <span class="widget-sub">本周阅读 3.5 小时</span>
                </div>
                <svg class="widget-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </li>
            </ul>
          </section>

          <!-- 操作区 -->
          <section class="action-section">
            <button class="btn-primary" data-toast="新建组件">+ 新建组件</button>
            <button class="btn-secondary" data-toast="编辑布局">编辑布局</button>
          </section>

          <div class="bottom-spacer" aria-hidden="true"></div>
        </main>

        <!-- 底部 Tab -->
        <nav class="tabbar" aria-label="主导航">
          <button class="tab is-active" data-tab="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>看板</span>
          </button>
          <button class="tab" data-tab="widgets">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>组件</span>
          </button>
          <button class="tab" data-tab="stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M7 14l3-3 3 3 5-6"/></svg>
            <span>统计</span>
          </button>
          <button class="tab" data-tab="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
            <span>设置</span>
          </button>
        </nav>

        <!-- Toast -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
