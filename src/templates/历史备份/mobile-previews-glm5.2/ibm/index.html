<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Carbon Task · IBM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏：Carbon 风格 0px 半径 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">
                  <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
                    <path d="M26.68 22h-5.88v-9.33h-3.08V22H12.64V6h-3.08v16H3.68V3.32h23v18.68z"/>
                  </svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">Carbon Task</span>
                  <span class="brand-sub">IBM Design System</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="通知" data-toast="暂无新通知">
                <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 17a7 7 0 0 0-7-7h-1V6a6 6 0 0 0-12 0v4H6a7 7 0 0 0-7 7v11h27V17z"/><circle cx="16" cy="28" r="2"/></svg>
              </button>
            </header>

            <!-- Hero Card：0px 半角 + Blue 60 accent（signature） -->
            <section class="hero-card" aria-label="任务概览">
              <p class="hero-card__label">本周任务进度</p>
              <p class="hero-card__value">87<span class="hero-card__percent">%</span></p>
              <div class="hero-card__meta">
                <span class="hero-card__stat">12 项进行中</span>
                <span class="hero-card__stat">3 项待审核</span>
              </div>
              <div class="hero-card__bar" aria-hidden="true">
                <span class="hero-card__bar-fill" style="--p: 87%"></span>
              </div>
              <div class="hero-card__actions">
                <button class="btn btn--primary" data-toast="创建新任务">
                  新建任务
                  <svg viewBox="0 0 32 32" fill="currentColor"><path d="M17 15L17 8 15 8 15 15 8 15 8 17 15 17 15 24 17 24 17 17 24 17 24 15z"/></svg>
                </button>
                <button class="btn btn--secondary" data-toast="查看全部任务">全部</button>
              </div>
            </section>

            <!-- 双卡片：Gray 10 surface, 0px radius -->
            <section class="stat-row" aria-label="项目统计">
              <div class="stat-card">
                <span class="stat-card__cap">活跃项目</span>
                <span class="stat-card__val">8</span>
                <span class="stat-card__foot">2 项本周截止</span>
              </div>
              <div class="stat-card">
                <span class="stat-card__cap">已完成</span>
                <span class="stat-card__val">156</span>
                <span class="stat-card__foot">本月 +23</span>
              </div>
            </section>

            <!-- 任务列表：行底边框分隔 -->
            <section class="list-block" aria-label="任务列表">
              <div class="list-block__head">
                <h2>最新任务</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选任务">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="pending" role="tab" aria-selected="false">进行中</button>
                  <button class="chip" data-filter="done" role="tab" aria-selected="false">已完成</button>
                </div>
              </div>

              <ul class="task-list" id="taskList">
                <li class="task" data-status="pending">
                  <span class="task__icon task__icon--pending">
                    <svg viewBox="0 0 32 32" fill="currentColor"><circle cx="16" cy="16" r="14"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">UI 设计系统评审</span>
                    <span class="task__sub">今天 14:00 · 设计团队</span>
                  </div>
                  <div class="task__right">
                    <span class="task__tag task__tag--high">高优先</span>
                    <span class="task__id">TK-2847</span>
                  </div>
                </li>
                <li class="task" data-status="done">
                  <span class="task__icon task__icon--done">
                    <svg viewBox="0 0 32 32" fill="currentColor"><path d="M14 21l-8-8 2-2 6 6 14-14 2 2z"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">API 文档更新</span>
                    <span class="task__sub">昨天 16:30 · 后端团队</span>
                  </div>
                  <div class="task__right">
                    <span class="task__tag task__tag--done">已完成</span>
                    <span class="task__id">TK-2831</span>
                  </div>
                </li>
                <li class="task" data-status="pending">
                  <span class="task__icon task__icon--pending">
                    <svg viewBox="0 0 32 32" fill="currentColor"><circle cx="16" cy="16" r="14"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">性能优化报告</span>
                    <span class="task__sub">明天 10:00 · 工程团队</span>
                  </div>
                  <div class="task__right">
                    <span class="task__tag task__tag--normal">中优先</span>
                    <span class="task__id">TK-2852</span>
                  </div>
                </li>
                <li class="task" data-status="pending">
                  <span class="task__icon task__icon--pending">
                    <svg viewBox="0 0 32 32" fill="currentColor"><circle cx="16" cy="16" r="14"/></svg>
                  </span>
                  <div class="task__main">
                    <span class="task__title">用户测试反馈整理</span>
                    <span class="task__sub">后天 15:00 · 产品团队</span>
                  </div>
                  <div class="task__right">
                    <span class="task__tag task__tag--normal">中优先</span>
                    <span class="task__id">TK-2863</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 底部输入框：bottom-border 模式（Carbon signature） -->
            <section class="input-section">
              <input type="text" class="input-field" placeholder="搜索任务..." aria-label="搜索任务">
              <button class="btn btn--icon" aria-label="搜索">
                <svg viewBox="0 0 32 32" fill="currentColor"><path d="M22 20l-4-4a9 9 0 1 0-2 2l4 4 2-2zm-10-8a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/></svg>
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab：0px active underline -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2L2 12v18h8v-8h12v8h8V12L16 2z"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="tasks">
              <svg viewBox="0 0 32 32" fill="currentColor"><path d="M4 4h24v4H4V4zm0 10h24v4H4v-4zm0 10h24v4H4v-4z"/></svg>
              <span>任务</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建">
              <svg viewBox="0 0 32 32" fill="currentColor"><path d="M17 15L17 8 15 8 15 15 8 15 8 17 15 17 15 24 17 24 17 17 24 17 24 15z"/></svg>
            </button>
            <button class="tab" data-tab="projects">
              <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2L2 8v16l14 6 14-6V8L16 2zm0 2.8L28.4 9 16 14.2 3.6 9 16 4.8zM4 10.4l10 4.3v11.4l-10-4.3V10.4zm12 15.7v-11.4l10-4.3v11.4l-10 4.3z"/></svg>
              <span>项目</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 32 32" fill="currentColor"><circle cx="16" cy="10" r="6"/><path d="M16 20c-6 0-11 4-12 9h24c-1-5-6-9-12-9z"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
