<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>AURUM · Luxury</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">A</span>
                <div class="brand-text">
                  <span class="brand-name">AURUM</span>
                  <span class="brand-sub">黑金会员 · Ping</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="礼宾服务" data-toast="专属礼宾服务">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" /></svg>
              </button>
            </header>

            <!-- 会员等级卡（signature：香槟金的大号等级标识） -->
            <section class="member-card" aria-label="会员等级">
              <div class="member-card__watermark" aria-hidden="true">DIAMOND</div>
              <p class="member-card__label">会员等级</p>
              <p class="member-card__tier">DIAMOND</p>
              <p class="member-card__sub">钻石会员 · 有效期至 2026.12</p>
              <div class="member-card__points">
                <span class="points-num">847,200</span>
                <span class="points-label">积分余额</span>
              </div>
              <div class="member-card__shine" aria-hidden="true"></div>
            </section>

            <!-- 专属权益双卡 -->
            <section class="privilege-row" aria-label="专属权益">
              <div class="privilege-card privilege-card--concierge">
                <svg class="privilege-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" /></svg>
                <span class="privilege-card__title">礼宾服务</span>
                <span class="privilege-card__desc">24/7 专属管家</span>
              </div>
              <div class="privilege-card privilege-card--lounge">
                <svg class="privilege-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" /></svg>
                <span class="privilege-card__title">贵宾休息室</span>
                <span class="privilege-card__desc">全球机场通用</span>
              </div>
            </section>

            <!-- 尊享体验列表 -->
            <section class="experience-list" aria-label="尊享体验">
              <h2 class="section-title">尊享体验</h2>
              <ul class="experience-items">
                <li class="experience-item">
                  <span class="experience-item__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9L12 15L18 9" /></svg>
                  </span>
                  <div class="experience-item__main">
                    <span class="experience-item__title">私人飞机预订</span>
                    <span class="experience-item__sub">会员专享价 · 包含礼宾服务</span>
                  </div>
                  <span class="experience-item__tag">NEW</span>
                </li>
                <li class="experience-item">
                  <span class="experience-item__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" /></svg>
                  </span>
                  <div class="experience-item__main">
                    <span class="experience-item__title">米其林餐厅</span>
                    <span class="experience-item__sub">优先预订 · 赠送主厨特选</span>
                  </div>
                  <span class="experience-item__tag">HOT</span>
                </li>
                <li class="experience-item">
                  <span class="experience-item__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10" /></svg>
                  </span>
                  <div class="experience-item__main">
                    <span class="experience-item__title">私人活动</span>
                    <span class="experience-item__sub">艺术展览 · 时装秀邀请</span>
                  </div>
                  <span class="experience-item__tag">VIP</span>
                </li>
                <li class="experience-item">
                  <span class="experience-item__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" /><line x1="16" y1="8" x2="2" y2="22" /><line x1="17.5" y1="15" x2="9" y2="15" /></svg>
                  </span>
                  <div class="experience-item__main">
                    <span class="experience-item__title">定制礼品</span>
                    <span class="experience-item__sub">专属设计师 · 一对一定制</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 积分进度 -->
            <section class="progress-card" aria-label="积分进度">
              <div class="progress-card__head">
                <span class="progress-card__title">保级进度</span>
                <span class="progress-card__num">847,200 <span class="muted">/ 1,000,000</span></span>
              </div>
              <div class="progress-card__bar" aria-hidden="true">
                <span class="progress-card__bar-fill" style="--p: 84.7%"></span>
              </div>
              <p class="progress-card__note">再获得 152,800 积分即可延续钻石会籍。</p>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="benefits">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.1 13.34 7 20 12 18 17 20 15.9 13.34" /></svg>
              <span>权益</span>
            </button>
            <button class="tab tab--fab" data-tab="concierge" aria-label="礼宾服务">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" /></svg>
            </button>
            <button class="tab" data-tab="experiences">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
              <span>体验</span>
            </button>
            <button class="tab" data-tab="me">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
