<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cavallino Control · Ferrari</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏：跃马标 + 精密工程感 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-logo">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2C8.5 2 6 4.5 6 7c0 1.5.5 2.5 1 3.5L5 14h14l-2-3.5c.5-1 1-2 1-3.5 0-2.5-2.5-5-6-5zm-2 8h4v1h-4v-1zm-1 3h6v2H9v-2zm-3 4h12v2H6v-2z"/>
                  </svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">FERRARI</span>
                  <span class="brand-sub">Cavallino Control</span>
                </div>
              </div>
              <button class="iconbtn iconbtn--accent" aria-label="车辆状态" data-toast="车辆系统正常">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" /></svg>
              </button>
            </header>

            <!-- Hero/车辆仪表卡（signature：暗色背景 + Ferrari Red 速度表） -->
            <section class="speedo-card" aria-label="仪表盘">
              <div class="speedo-dial" aria-hidden="true">
                <svg class="speedo-svg" viewBox="0 0 200 100">
                  <path class="speedo-arc" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                  <path class="speedo-arc-active" d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="60"/>
                  <text x="100" y="75" text-anchor="middle" class="speedo-value">187</text>
                  <text x="100" y="90" text-anchor="middle" class="speedo-unit">KM/H</text>
                </svg>
              </div>
              <div class="speedo-meta">
                <div class="speed-stat">
                  <span class="speed-stat__label">RPM</span>
                  <span class="speed-stat__value">7,200</span>
                </div>
                <div class="speed-stat">
                  <span class="speed-stat__label">GEAR</span>
                  <span class="speed-stat__value">5</span>
                </div>
                <div class="speed-stat">
                  <span class="speed-stat__label">TEMP</span>
                  <span class="speed-stat__value">92°C</span>
                </div>
              </div>
            </section>

            <!-- 车辆状态卡片 -->
            <section class="vehicle-stats" aria-label="车辆状态">
              <div class="stat-card stat-card--fuel">
                <span class="stat-card__icon">⛽</span>
                <div class="stat-card__content">
                  <span class="stat-card__label">燃料</span>
                  <span class="stat-card__value">68%</span>
                </div>
                <div class="stat-card__bar"><span class="stat-card__bar-fill" style="--p: 68%"></span></div>
              </div>
              <div class="stat-card stat-card--oil">
                <span class="stat-card__icon">🛢️</span>
                <div class="stat-card__content">
                  <span class="stat-card__label">机油</span>
                  <span class="stat-card__value">正常</span>
                </div>
              </div>
              <div class="stat-card stat-card--tire">
                <span class="stat-card__icon">🔧</span>
                <div class="stat-card__content">
                  <span class="stat-card__label">胎压</span>
                  <span class="stat-card__value">2.4 BAR</span>
                </div>
              </div>
            </section>

            <!-- 快捷控制（Ferrari Red 点缀） -->
            <section class="quick-controls" aria-label="快捷控制">
              <button class="control-btn control-btn--primary" data-toast="启动引擎">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20" /></svg>
                <span>启动</span>
              </button>
              <button class="control-btn control-btn--secondary" data-toast="打开车灯">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" /></svg>
                <span>车灯</span>
              </button>
              <button class="control-btn control-btn--secondary" data-toast="空调已开启">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20" /><circle cx="12" cy="12" r="5" /></svg>
                <span>空调</span>
              </button>
              <button class="control-btn control-btn--secondary" data-toast="锁车中">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                <span>锁车</span>
              </button>
            </section>

            <!-- 驾驶模式选择 -->
            <section class="drive-modes" aria-label="驾驶模式">
              <h3 class="section-label">DRIVE MODE</h3>
              <div class="mode-chips" role="radiogroup" aria-label="选择驾驶模式">
                <button class="mode-chip is-active" data-mode="comfort" role="radio" aria-checked="true">COMFORT</button>
                <button class="mode-chip" data-mode="sport" role="radio" aria-checked="false">SPORT</button>
                <button class="mode-chip" data-mode="race" role="radio" aria-checked="false">RACE</button>
              </div>
            </section>

            <!-- 车辆信息列表 -->
            <section class="vehicle-list" aria-label="车辆信息">
              <div class="list-item">
                <span class="list-item__icon">📍</span>
                <div class="list-item__content">
                  <span class="list-item__title">当前位置</span>
                  <span class="list-item__sub">马拉内罗工厂</span>
                </div>
                <span class="list-item__value">12 km</span>
              </div>
              <div class="list-item">
                <span class="list-item__icon">⏱️</span>
                <div class="list-item__content">
                  <span class="list-item__title">驾驶时间</span>
                  <span class="list-item__sub">今日累计</span>
                </div>
                <span class="list-item__value">2h 45m</span>
              </div>
              <div class="list-item">
                <span class="list-item__icon">🏁</span>
                <div class="list-item__content">
                  <span class="list-item__title">赛道记录</span>
                  <span class="list-item__sub">菲奥拉诺</span>
                </div>
                <span class="list-item__value">1:18.5</span>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab（精密工程风格） -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="dashboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" /></svg>
              <span>仪表</span>
            </button>
            <button class="tab" data-tab="navigation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg>
              <span>导航</span>
            </button>
            <button class="tab" data-tab="media">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3" /></svg>
              <span>媒体</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.2-13.8l-4.2 4.2m0 7.6l4.2 4.2M1 12h6m6 0h6m-2.8-5.2l-4.2-4.2m0 7.6l-4.2 4.2" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
