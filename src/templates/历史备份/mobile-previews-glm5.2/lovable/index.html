<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI 构建器 · Lovable</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">L</div>
                <div class="brand-text">
                  <span class="brand-name">Lovable</span>
                  <span class="brand-sub">AI 构建器</span>
                </div>
              </div>
              <div class="topbar__actions">
                <button class="pill-btn" aria-label="计划模式" data-toast="计划模式">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10" /></svg>
                </button>
                <button class="pill-btn pill-btn--voice" aria-label="语音输入" data-toast="语音输入">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="23" /><line x1="8" y1="23" x2="16" y2="23" /></svg>
                </button>
              </div>
            </header>

            <!-- Hero 签名区：渐变背景 + 大数字统计 -->
            <section class="hero-section" aria-label="项目概览">
              <div class="hero-gradient"></div>
              <div class="hero-content">
                <h1 class="hero-title">开始构建你的下一个项目</h1>
                <p class="hero-subtitle">用 AI 驱动的创造力，将想法变为现实</p>

                <div class="hero-stats">
                  <div class="hero-stat">
                    <span class="hero-stat__val">0</span>
                    <span class="hero-stat__label">正在构建</span>
                  </div>
                  <div class="hero-stat">
                    <span class="hero-stat__val">12</span>
                    <span class="hero-stat__label">已部署</span>
                  </div>
                  <div class="hero-stat">
                    <span class="hero-stat__val">48</span>
                    <span class="hero-stat__label">模板</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- AI 输入区：Signature —— 温暖的输入框 + 建议 Pills -->
            <section class="ai-input-section" aria-label="AI 输入">
              <div class="input-card">
                <div class="input-header">
                  <span class="input-label">描述你想构建的内容</span>
                  <button class="input-hint" aria-label="帮助提示" data-toast="输入自然语言描述，AI 将生成代码">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
                  </button>
                </div>

                <div class="input-area" contenteditable="true" role="textbox" aria-label="输入你的项目描述">
                  <span class="input-placeholder">例如：一个待办事项应用，支持标签和提醒...</span>
                </div>

                <div class="suggestion-pills">
                  <button class="suggestion-pill" data-toast="已填入建议">
                    <span>📱</span>
                    移动应用
                  </button>
                  <button class="suggestion-pill" data-toast="已填入建议">
                    <span>🛒</span>
                    电商网站
                  </button>
                  <button class="suggestion-pill" data-toast="已填入建议">
                    <span>📊</span>
                    数据仪表盘
                  </button>
                </div>

                <div class="input-actions">
                  <button class="btn-primary" data-toast="AI 正在生成...">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                    开始生成
                  </button>
                </div>
              </div>
            </section>

            <!-- 最近项目卡片 -->
            <section class="projects-section" aria-label="最近项目">
              <div class="section-header">
                <h2 class="section-title">最近项目</h2>
                <div class="filter-tabs" id="projectTabs" role="tablist" aria-label="项目筛选">
                  <button class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="filter-tab" data-filter="deployed" role="tab" aria-selected="false">已部署</button>
                  <button class="filter-tab" data-filter="draft" role="tab" aria-selected="false">草稿</button>
                </div>
              </div>

              <ul class="project-list" id="projectList">
                <li class="project-card" data-filter="deployed">
                  <div class="project-preview project-preview--gradient-1"></div>
                  <div class="project-info">
                    <h4 class="project-name">任务管理器</h4>
                    <p class="project-desc">团队协作的待办事项应用</p>
                    <div class="project-meta">
                      <span class="project-status project-status--success">已部署</span>
                      <span class="project-date">2 小时前</span>
                    </div>
                  </div>
                  <button class="project-menu" aria-label="更多选项" data-toast="项目选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>

                <li class="project-card" data-filter="draft">
                  <div class="project-preview project-preview--gradient-2"></div>
                  <div class="project-info">
                    <h4 class="project-name">博客主题</h4>
                    <p class="project-desc">极简风格的写作平台</p>
                    <div class="project-meta">
                      <span class="project-status project-status--draft">草稿</span>
                      <span class="project-date">昨天</span>
                    </div>
                  </div>
                  <button class="project-menu" aria-label="更多选项" data-toast="项目选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>

                <li class="project-card" data-filter="deployed">
                  <div class="project-preview project-preview--gradient-3"></div>
                  <div class="project-info">
                    <h4 class="project-name">个人作品集</h4>
                    <p class="project-desc">设计师的展示网站</p>
                    <div class="project-meta">
                      <span class="project-status project-status--success">已部署</span>
                      <span class="project-date">3 天前</span>
                    </div>
                  </div>
                  <button class="project-menu" aria-label="更多选项" data-toast="项目选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 模板画廊 -->
            <section class="templates-section" aria-label="模板画廊">
              <div class="section-header">
                <h2 class="section-title">开始使用模板</h2>
              </div>

              <div class="template-grid">
                <button class="template-card" data-toast="已选择 SaaS 模板">
                  <div class="template-preview template-preview--saas"></div>
                  <span class="template-name">SaaS 登陆页</span>
                </button>
                <button class="template-card" data-toast="已选择仪表盘模板">
                  <div class="template-preview template-preview--dashboard"></div>
                  <span class="template-name">数据仪表盘</span>
                </button>
                <button class="template-card" data-toast="已选择电商模板">
                  <div class="template-preview template-preview--ecommerce"></div>
                  <span class="template-name">电商店铺</span>
                </button>
                <button class="template-card" data-toast="已选择博客模板">
                  <div class="template-preview template-preview--blog"></div>
                  <span class="template-name">博客平台</span>
                </button>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="projects">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21" /></svg>
              <span>项目</span>
            </button>
            <button class="tab tab--create" data-tab="create">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
            </button>
            <button class="tab" data-tab="templates">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><path d="M3 9h18" /><path d="M9 21V9" /></svg>
              <span>模板</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
