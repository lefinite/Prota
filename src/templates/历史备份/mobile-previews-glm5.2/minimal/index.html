<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Minimal Tasks · Minimal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">M</div>
                <div class="brand-text">
                  <span class="brand-name">Minimal Tasks</span>
                  <span class="brand-sub">Today, Aug 14</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </button>
            </header>

            <!-- Hero Card: Progress Overview (Signature: Bold typography focus) -->
            <section class="hero-card" aria-label="今日进度">
              <p class="hero-card__label">Today's Progress</p>
              <p class="hero-card__title">8 <span class="hero-card__title-muted">of 12</span></p>
              <p class="hero-card__subtitle">tasks completed</p>
              <div class="hero-card__bar">
                <span class="hero-card__bar-fill" style="--p: 66%"></span>
              </div>
            </section>

            <!-- Quick Stats Cards -->
            <section class="stats-row" aria-label="任务统计">
              <div class="stat-card">
                <span class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </span>
                <span class="stat-card__val">4</span>
                <span class="stat-card__label">待办</span>
              </div>
              <div class="stat-card">
                <span class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
                <span class="stat-card__val">8</span>
                <span class="stat-card__label">完成</span>
              </div>
              <div class="stat-card">
                <span class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span>
                <span class="stat-card__val">2</span>
                <span class="stat-card__label">过期</span>
              </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section" aria-label="任务列表">
              <div class="section-header">
                <h2 class="section-title">Today</h2>
                <div class="filter-chips" id="filterChips" role="tablist" aria-label="筛选任务">
                  <button class="filter-chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="filter-chip" data-filter="pending" role="tab" aria-selected="false">待办</button>
                  <button class="filter-chip" data-filter="done" role="tab" aria-selected="false">完成</button>
                </div>
              </div>

              <ul class="task-list" id="taskList">
                <li class="task-item" data-status="pending">
                  <button class="task-check" aria-label="标记完成" data-toast="任务已标记为完成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">完成产品设计稿</span>
                    <span class="task-meta">设计 · 下午3点</span>
                  </div>
                  <span class="task-priority task-priority--high"></span>
                </li>
                <li class="task-item" data-status="done">
                  <button class="task-check is-checked" aria-label="标记未完成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title is-done">团队周会</span>
                    <span class="task-meta">会议 · 已完成</span>
                  </div>
                </li>
                <li class="task-item" data-status="pending">
                  <button class="task-check" aria-label="标记完成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">代码审查 PR</span>
                    <span class="task-meta">开发 · 下午5点</span>
                  </div>
                  <span class="task-priority task-priority--medium"></span>
                </li>
                <li class="task-item" data-status="pending">
                  <button class="task-check" aria-label="标记完成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">更新项目文档</span>
                    <span class="task-meta">文档 · 明天</span>
                  </div>
                  <span class="task-priority task-priority--low"></span>
                </li>
                <li class="task-item" data-status="done">
                  <button class="task-check is-checked" aria-label="标记未完成">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title is-done">回复客户邮件</span>
                    <span class="task-meta">邮件 · 已完成</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- Add Task Input -->
            <section class="add-task-section">
              <div class="add-task-wrapper">
                <input type="text" class="add-task-input" placeholder="添加新任务..." aria-label="新任务">
                <button class="add-task-btn" aria-label="添加任务" data-toast="新任务已添加">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="tasks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <span>任务</span>
            </button>
            <button class="tab" data-tab="calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>日历</span>
            </button>
            <button class="tab" data-tab="notes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <span>笔记</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
