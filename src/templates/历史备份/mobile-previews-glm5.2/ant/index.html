<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>企业审批台 · Ant Design</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-logo">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2L19.5 8 12 11.8 4.5 8 12 4.2zM4 9.5l7 4v6.5l-7-3.5V9.5zm9 10.5v-6.5l7-4v7L13 20z"/>
                  </svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">企业审批台</span>
                  <span class="brand-sub">待处理 · 5 项</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索审批记录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </button>
            </header>

            <!-- 审批概览卡（signature：红色强调 + 密集数据布局） -->
            <section class="approval-overview" aria-label="今日审批概览">
              <div class="approval-overview__header">
                <h2 class="approval-overview__title">今日待办</h2>
                <span class="tag tag--urgent">3 紧急</span>
              </div>
              <div class="approval-stats">
                <div class="stat-item">
                  <span class="stat-value stat-value--pending">12</span>
                  <span class="stat-label">待审批</span>
                </div>
                <div class="stat-item">
                  <span class="stat-value stat-value--approved">28</span>
                  <span class="stat-label">已通过</span>
                </div>
                <div class="stat-item">
                  <span class="stat-value stat-value--rejected">3</span>
                  <span class="stat-label">已驳回</span>
                </div>
              </div>
              <div class="approval-progress">
                <div class="approval-progress__bar">
                  <div class="approval-progress__fill" style="--p: 70%"></div>
                </div>
                <span class="approval-progress__text">今日进度 70%</span>
              </div>
            </section>

            <!-- 快捷操作区 -->
            <section class="quick-actions" aria-label="快捷操作">
              <button class="action-btn" data-toast="新建采购申请">
                <span class="action-btn__icon">+</span>
                <span class="action-btn__label">新建申请</span>
              </button>
              <button class="action-btn" data-toast="查看抄送列表">
                <span class="action-btn__icon">@</span>
                <span class="action-btn__label">抄送列表</span>
              </button>
              <button class="action-btn" data-toast="历史记录">
                <span class="action-btn__icon">:</span>
                <span class="action-btn__label">历史记录</span>
              </button>
              <button class="action-btn" data-toast="审批模板">
                <span class="action-btn__icon">≡</span>
                <span class="action-btn__label">审批模板</span>
              </button>
            </section>

            <!-- 审批列表 -->
            <section class="approval-list" aria-label="待审批列表">
              <div class="list-header">
                <h3>待审批项目</h3>
                <div class="filter-tabs" id="filterTabs" role="tablist">
                  <button class="filter-tab is-active" data-filter="all" role="tab">全部</button>
                  <button class="filter-tab" data-filter="urgent" role="tab">紧急</button>
                  <button class="filter-tab" data-filter="normal" role="tab">普通</button>
                </div>
              </div>

              <div class="approval-items" id="approvalItems">
                <div class="approval-item" data-urgency="urgent">
                  <div class="approval-item__icon approval-item__icon--expense">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M7 8h0"/></svg>
                  </div>
                  <div class="approval-item__content">
                    <span class="approval-item__title">差旅费用报销</span>
                    <span class="approval-item__meta">张三 · 采购部 · ¥3,280</span>
                  </div>
                  <div class="approval-item__status">
                    <span class="priority-badge priority-badge--high">紧急</span>
                    <span class="time-tag">2小时前</span>
                  </div>
                </div>

                <div class="approval-item" data-urgency="urgent">
                  <div class="approval-item__icon approval-item__icon--contract">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  </div>
                  <div class="approval-item__content">
                    <span class="approval-item__title">供应商合同续签</span>
                    <span class="approval-item__meta">李四 · 法务部 · ¥120,000</span>
                  </div>
                  <div class="approval-item__status">
                    <span class="priority-badge priority-badge--high">紧急</span>
                    <span class="time-tag">5小时前</span>
                  </div>
                </div>

                <div class="approval-item" data-urgency="normal">
                  <div class="approval-item__icon approval-item__icon--leave">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  </div>
                  <div class="approval-item__content">
                    <span class="approval-item__title">年假申请</span>
                    <span class="approval-item__meta">王五 · 技术部 · 5天</span>
                  </div>
                  <div class="approval-item__status">
                    <span class="priority-badge priority-badge--normal">普通</span>
                    <span class="time-tag">昨天</span>
                  </div>
                </div>

                <div class="approval-item" data-urgency="urgent">
                  <div class="approval-item__icon approval-item__icon--purchase">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                  </div>
                  <div class="approval-item__content">
                    <span class="approval-item__title">设备采购申请</span>
                    <span class="approval-item__meta">赵六 · 运营部 · ¥28,500</span>
                  </div>
                  <div class="approval-item__status">
                    <span class="priority-badge priority-badge--high">紧急</span>
                    <span class="time-tag">2天前</span>
                  </div>
                </div>

                <div class="approval-item" data-urgency="normal">
                  <div class="approval-item__icon approval-item__icon--meeting">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                  </div>
                  <div class="approval-item__content">
                    <span class="approval-item__title">会议室预订</span>
                    <span class="approval-item__meta">钱七 · 产品部 · 3小时</span>
                  </div>
                  <div class="approval-item__status">
                    <span class="priority-badge priority-badge--normal">普通</span>
                    <span class="time-tag">3天前</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- 操作按钮区 -->
            <section class="action-area">
              <button class="btn btn--primary" data-toast="批量审批选中项目">批量审批</button>
              <button class="btn btn--secondary" data-toast="查看更多">查看更多</button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="pending">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>待办</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="tab" data-tab="history">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>
              <span>记录</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
