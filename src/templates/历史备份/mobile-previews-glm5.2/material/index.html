<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TaskFlow · Material</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <!-- 顶部应用栏 -->
          <header class="top-app-bar">
            <span class="top-app-bar__title">TaskFlow</span>
            <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" /></svg>
            </button>
          </header>

          <main class="app-content" id="appContent">
            <!-- 今日进度卡（signature：Material 波纹效果 + 圆角） -->
            <section class="today-card" aria-label="今日任务">
              <div class="today-card__header">
                <span class="today-card__greeting">早上好，Ping</span>
                <span class="today-card__date">8月14日，周四</span>
              </div>
              <div class="today-card__stats">
                <div class="stat-item">
                  <span class="stat-item__value">12</span>
                  <span class="stat-item__label">已完成</span>
                </div>
                <div class="stat-item">
                  <span class="stat-item__value">5</span>
                  <span class="stat-item__label">进行中</span>
                </div>
                <div class="stat-item">
                  <span class="stat-item__value">3</span>
                  <span class="stat-item__label">待开始</span>
                </div>
              </div>
              <div class="today-card__progress">
                <div class="progress-bar" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="--progress: 60%">
                  <span class="progress-bar__fill"></span>
                </div>
                <span class="progress-label">今日完成度 60%</span>
              </div>
            </section>

            <!-- 快速添加 -->
            <section class="quick-add" aria-label="快速添加">
              <div class="chips-row" role="tablist" aria-label="任务分类">
                <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                <button class="chip" data-filter="work" role="tab" aria-selected="false">工作</button>
                <button class="chip" data-filter="personal" role="tab" aria-selected="false">个人</button>
                <button class="chip" data-filter="urgent" role="tab" aria-selected="false">紧急</button>
              </div>
            </section>

            <!-- 任务列表 -->
            <section class="task-section" aria-label="任务列表">
              <h2 class="section-title">今日任务</h2>
              <ul class="task-list" id="taskList">
                <li class="task-item task-item--completed" data-category="work">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">完成项目设计稿</span>
                    <span class="task-sub">设计 · 优先级：高</span>
                  </div>
                  <span class="task-time">09:30</span>
                </li>
                <li class="task-item" data-category="work">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">团队周会准备</span>
                    <span class="task-sub">会议 · 10:00 开始</span>
                  </div>
                  <span class="task-time task-time--upcoming">10:00</span>
                </li>
                <li class="task-item" data-category="personal">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">健身房打卡</span>
                    <span class="task-sub">健康 · 45分钟</span>
                  </div>
                  <span class="task-time task-time--upcoming">12:30</span>
                </li>
                <li class="task-item" data-category="urgent">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">客户反馈回复</span>
                    <span class="task-sub">工作 · 紧急</span>
                  </div>
                  <span class="task-time task-time--upcoming">14:00</span>
                </li>
                <li class="task-item" data-category="work">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">代码审查</span>
                    <span class="task-sub">开发 · PR #128</span>
                  </div>
                  <span class="task-time">15:30</span>
                </li>
                <li class="task-item" data-category="personal">
                  <button class="task-checkbox" aria-label="标记任务状态">
                    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
                  </button>
                  <div class="task-content">
                    <span class="task-title">阅读技术文章</span>
                    <span class="task-sub">学习 · 30分钟</span>
                  </div>
                  <span class="task-time">18:00</span>
                </li>
              </ul>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 浮动操作按钮 (FAB) -->
          <button class="fab" aria-label="新建任务" data-toast="新建任务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>

          <!-- 底部导航 -->
          <nav class="bottom-nav" aria-label="主导航">
            <button class="nav-item is-active" data-tab="tasks">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></svg>
              <span>任务</span>
            </button>
            <button class="nav-item" data-tab="calendar">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10" /></svg>
              <span>日历</span>
            </button>
            <button class="nav-item" data-tab="stats">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6" /></svg>
              <span>统计</span>
            </button>
            <button class="nav-item" data-tab="settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Snackbar -->
          <div class="snackbar" id="snackbar" role="status" aria-live="polite">
            <span class="snackbar__text"></span>
            <button class="snackbar__action">撤销</button>
          </div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
