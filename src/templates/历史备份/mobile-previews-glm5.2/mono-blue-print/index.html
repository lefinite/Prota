<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BlueprintAI · Mono Blueprint</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 - 工程蓝图风 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-logo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">BlueprintAI</span>
                  <span class="brand-sub">工程构建器</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="设置" data-toast="设置面板">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg>
              </button>
            </header>

            <!-- Hero signature：蓝图网格卡片 -->
            <section class="blueprint-card" aria-label="项目概览">
              <div class="blueprint-header">
                <span class="blueprint-label">PROJECT_ID: BP-2024-0847</span>
                <span class="status-dot status-dot--active"></span>
              </div>
              <div class="blueprint-metrics">
                <div class="metric">
                  <span class="metric__label">组件数</span>
                  <span class="metric__value">47</span>
                </div>
                <div class="metric">
                  <span class="metric__label">连线</span>
                  <span class="metric__value">128</span>
                </div>
                <div class="metric">
                  <span class="metric__label">复杂度</span>
                  <span class="metric__value">L2</span>
                </div>
              </div>
              <div class="blueprint-preview" aria-hidden="true">
                <div class="grid-line grid-line--h1"></div>
                <div class="grid-line grid-line--h2"></div>
                <div class="grid-line grid-line--h3"></div>
                <div class="grid-line grid-line--v1"></div>
                <div class="grid-line grid-line--v2"></div>
                <div class="node node--1"></div>
                <div class="node node--2"></div>
                <div class="node node--3"></div>
                <div class="node node--4"></div>
              </div>
              <div class="blueprint-actions">
                <button class="action-btn action-btn--primary" data-toast="正在编译...">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                  编译
                </button>
                <button class="action-btn" data-toast="导出蓝图">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" /></svg>
                  导出
                </button>
                <button class="action-btn" data-toast="验证中...">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="20 6 9 17 4 12" /></svg>
                  验证
                </button>
              </div>
            </section>

            <!-- 双卡统计 -->
            <section class="stat-row" aria-label="资源统计">
              <div class="stat-card">
                <span class="stat-card__cap">CPU</span>
                <span class="stat-card__val">42<span class="stat-card__unit">%</span></span>
                <span class="stat-card__foot">
                  <span class="status-dot status-dot--ok"></span>稳定
                </span>
              </div>
              <div class="stat-card">
                <span class="stat-card__cap">内存</span>
                <span class="stat-card__val">1.2<span class="stat-card__unit">GB</span></span>
                <span class="stat-card__foot">
                  <span class="status-dot status-dot--warn"></span>+240MB
                </span>
              </div>
            </section>

            <!-- 模块列表 -->
            <section class="list-block" aria-label="模块列表">
              <div class="list-block__head">
                <h2>MODULES</h2>
                <div class="chips" id="filterChips" role="tablist">
                  <button class="chip is-active" data-filter="all" role="tab">ALL</button>
                  <button class="chip" data-filter="active" role="tab">ACTIVE</button>
                  <button class="chip" data-filter="pending" role="tab">PENDING</button>
                </div>
              </div>

              <ul class="module-list" id="moduleList">
                <li class="module-item" data-type="active">
                  <div class="module-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                  </div>
                  <div class="module-main">
                    <span class="module-title">布局引擎</span>
                    <span class="module-sub">v2.4.0 · 已部署</span>
                  </div>
                  <div class="module-right">
                    <span class="module-id">MOD-01</span>
                    <span class="badge badge--success">运行中</span>
                  </div>
                </li>
                <li class="module-item" data-type="active">
                  <div class="module-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  </div>
                  <div class="module-main">
                    <span class="module-title">定时器模块</span>
                    <span class="module-sub">v1.8.2 · 已部署</span>
                  </div>
                  <div class="module-right">
                    <span class="module-id">MOD-02</span>
                    <span class="badge badge--success">运行中</span>
                  </div>
                </li>
                <li class="module-item" data-type="pending">
                  <div class="module-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                  </div>
                  <div class="module-main">
                    <span class="module-title">数据同步</span>
                    <span class="module-sub">v0.9.0 · 测试中</span>
                  </div>
                  <div class="module-right">
                    <span class="module-id">MOD-03</span>
                    <span class="badge badge--warn">待部署</span>
                  </div>
                </li>
                <li class="module-item" data-type="pending">
                  <div class="module-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                  </div>
                  <div class="module-main">
                    <span class="module-title">安全认证</span>
                    <span class="module-sub">v1.0.0 · 审核中</span>
                  </div>
                  <div class="module-right">
                    <span class="module-id">MOD-04</span>
                    <span class="badge badge--muted">审核中</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 部署进度 -->
            <section class="progress-card" aria-label="部署状态">
              <div class="progress-header">
                <span class="progress-title">DEPLOY_PIPELINE</span>
                <span class="progress-num">3 <span class="muted">/ 5</span></span>
              </div>
              <div class="progress-bar" aria-hidden="true">
                <span class="progress-fill" style="--p: 60%"></span>
              </div>
              <p class="progress-note">构建完成，等待测试验证。</p>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="blueprint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
              <span>蓝图</span>
            </button>
            <button class="tab" data-tab="modules">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>模块</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建模块">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="tab" data-tab="deploy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3" /></svg>
              <span>部署</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg>
              <span>配置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
