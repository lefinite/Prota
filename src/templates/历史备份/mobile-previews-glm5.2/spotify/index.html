<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>音悦 · Spotify Dark</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M6 8c0-3 2.5-5 5-5s5 2 5 5v0"/>
                  <path d="M12 13c0 3-2.5 5-5 5s-5-2-5-5v0"/>
                  <path d="M18 8c0 3-2.5 5-5 5s-5-2-5-5v0"/>
                  <path d="M12 13c0 3 2.5 5 5 5s5-2 5-5v0"/>
                </svg>
                <span class="brand-name">音悦</span>
              </div>
              <div class="topbar__actions">
                <button class="iconbtn" aria-label="搜索" data-toast="搜索音乐">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
                <button class="iconbtn" aria-label="设置" data-toast="设置">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.3-10.3-4.3 4.3m0 6 4.3 4.3M1 12h6m6 0h6M4.7 4.7l4.3 4.3m0 6-4.3 4.3"/></svg>
                </button>
              </div>
            </header>

            <!-- 正在播放（signature：专辑封面 + 播放控制） -->
            <section class="now-playing" aria-label="正在播放">
              <div class="album-art">
                <div class="album-art__placeholder">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                  </svg>
                </div>
                <div class="album-art__overlay">
                  <span class="album-art__tag">正在播放</span>
                </div>
              </div>

              <div class="track-info">
                <h2 class="track-title">夜曲</h2>
                <p class="track-artist">周杰伦 · 七里香</p>
              </div>

              <div class="playback-controls">
                <button class="control-btn" data-toast="随机播放" aria-label="随机播放">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button class="control-btn control-btn--large" data-toast="上一首" aria-label="上一首">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="play-btn" id="playBtn" data-play="false" aria-label="播放">
                  <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                </button>
                <button class="control-btn control-btn--large" data-toast="下一首" aria-label="下一首">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="control-btn" data-toast="循环播放" aria-label="循环播放">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
              </div>

              <div class="progress-bar">
                <div class="progress-bar__track">
                  <div class="progress-bar__fill" style="--p: 35%"></div>
                </div>
                <div class="progress-bar__time">
                  <span>1:24</span>
                  <span>4:02</span>
                </div>
              </div>
            </section>

            <!-- 播放列表双卡 -->
            <section class="playlist-row" aria-label="推荐歌单">
              <div class="playlist-card">
                <div class="playlist-card__art playlist-card__art--gradient-1"></div>
                <div class="playlist-card__info">
                  <h4 class="playlist-card__title">华语经典</h4>
                  <p class="playlist-card__subtitle">128首歌曲</p>
                </div>
                <button class="play-icon-sm" data-toast="播放华语经典" aria-label="播放">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
              </div>
              <div class="playlist-card">
                <div class="playlist-card__art playlist-card__art--gradient-2"></div>
                <div class="playlist-card__info">
                  <h4 class="playlist-card__title">深夜电台</h4>
                  <p class="playlist-card__subtitle">96首歌曲</p>
                </div>
                <button class="play-icon-sm" data-toast="播放深夜电台" aria-label="播放">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
              </div>
            </section>

            <!-- 热门歌曲列表 -->
            <section class="track-list" aria-label="热门歌曲">
              <div class="list-header">
                <h3>热门歌曲</h3>
                <div class="chips" id="genreChips" role="tablist" aria-label="音乐类型">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="pop" role="tab" aria-selected="false">流行</button>
                  <button class="chip" data-filter="rock" role="tab" aria-selected="false">摇滚</button>
                </div>
              </div>

              <ul class="track-list__items" id="trackList">
                <li class="track-item" data-genre="pop">
                  <span class="track-item__num">1</span>
                  <div class="track-item__info">
                    <span class="track-item__title">晴天</span>
                    <span class="track-item__artist">周杰伦</span>
                  </div>
                  <span class="track-item__album">叶惠美</span>
                  <span class="track-item__duration">4:29</span>
                  <button class="track-item__like" data-toast="已添加到喜欢" aria-label="喜欢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </button>
                </li>
                <li class="track-item" data-genre="pop">
                  <span class="track-item__num">2</span>
                  <div class="track-item__info">
                    <span class="track-item__title">七里香</span>
                    <span class="track-item__artist">周杰伦</span>
                  </div>
                  <span class="track-item__album">七里香</span>
                  <span class="track-item__duration">5:05</span>
                  <button class="track-item__like track-item__like--active" data-toast="已取消喜欢" aria-label="取消喜欢">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </button>
                </li>
                <li class="track-item" data-genre="rock">
                  <span class="track-item__num">3</span>
                  <div class="track-item__info">
                    <span class="track-item__title">海阔天空</span>
                    <span class="track-item__artist">Beyond</span>
                  </div>
                  <span class="track-item__album">乐与怒</span>
                  <span class="track-item__duration">5:24</span>
                  <button class="track-item__like" data-toast="已添加到喜欢" aria-label="喜欢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </button>
                </li>
                <li class="track-item" data-genre="pop">
                  <span class="track-item__num">4</span>
                  <div class="track-item__info">
                    <span class="track-item__title">稻香</span>
                    <span class="track-item__artist">周杰伦</span>
                  </div>
                  <span class="track-item__album">魔杰座</span>
                  <span class="track-item__duration">3:43</span>
                  <button class="track-item__like" data-toast="已添加到喜欢" aria-label="喜欢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </button>
                </li>
                <li class="track-item" data-genre="rock">
                  <span class="track-item__num">5</span>
                  <div class="track-item__info">
                    <span class="track-item__title">光辉岁月</span>
                    <span class="track-item__artist">Beyond</span>
                  </div>
                  <span class="track-item__album">命运派对</span>
                  <span class="track-item__duration">4:55</span>
                  <button class="track-item__like" data-toast="已添加到喜欢" aria-label="喜欢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 播放进度 -->
            <section class="listening-stats" aria-label="收听统计">
              <div class="stats-card">
                <span class="stats-card__label">今日收听</span>
                <span class="stats-card__value">2小时 45分钟</span>
              </div>
              <div class="stats-card">
                <span class="stats-card__label">本周排名</span>
                <span class="stats-card__value stats-card__value--accent">TOP 5%</span>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <span>搜索</span>
            </button>
            <button class="tab tab--library" data-tab="library" aria-label="音乐库">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            </button>
            <button class="tab" data-tab="premium">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>高级</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
