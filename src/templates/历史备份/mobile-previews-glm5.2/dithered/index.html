<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pixel Quest · Dithered</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-pixel">[P]</div>
                <div class="brand-text">
                  <span class="brand-name">PIXEL QUEST</span>
                  <span class="brand-sub">LEVEL 12 · EXPLORER</span>
                </div>
              </div>
              <button class="iconbtn pixel-border" aria-label="设置" data-toast="设置菜单">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </header>

            <!-- Hero 卡：signature —— 像素风格等级展示 -->
            <section class="hero-card pixel-border" aria-label="当前等级">
              <div class="hero-level">
                <span class="level-label">CURRENT LEVEL</span>
                <span class="level-number">12</span>
              </div>
              <div class="hero-stats">
                <div class="stat">
                  <span class="stat-val">2,847</span>
                  <span class="stat-label">XP</span>
                </div>
                <div class="stat">
                  <span class="stat-val">156</span>
                  <span class="stat-label">探索</span>
                </div>
                <div class="stat">
                  <span class="stat-val">23</span>
                  <span class="stat-label">徽章</span>
                </div>
              </div>
              <div class="hero-progress">
                <span class="progress-fill" style="--p: 68%"></span>
              </div>
              <p class="hero-hint">距 13 级还需 1,153 XP</p>
            </section>

            <!-- 任务双卡 -->
            <section class="mission-row" aria-label="任务进度">
              <div class="mission-card pixel-border">
                <span class="mission-tag daily">每日</span>
                <span class="mission-title">像素迷宫</span>
                <span class="mission-status">2/3 完成</span>
                <div class="mission-bar"><span class="mission-fill" style="--p: 66%"></span></div>
              </div>
              <div class="mission-card pixel-border">
                <span class="mission-tag weekly">周常</span>
                <span class="mission-title">传奇装备</span>
                <span class="mission-status">1/5 完成</span>
                <div class="mission-bar"><span class="mission-fill" style="--p: 20%"></span></div>
              </div>
            </section>

            <!-- 成就列表 -->
            <section class="list-block" aria-label="最近成就">
              <div class="list-block__head">
                <h2>最近成就</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选成就">
                  <button class="chip pixel-border is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip pixel-border" data-filter="new" role="tab" aria-selected="false">新获得</button>
                </div>
              </div>

              <ul class="achievement-list" id="achievementList">
                <li class="achievement" data-type="new">
                  <span class="achievement-icon pixel-border">★</span>
                  <div class="achievement-main">
                    <span class="achievement-title">像素大师</span>
                    <span class="achievement-desc">完成 100 个像素关卡</span>
                  </div>
                  <span class="achievement-time">2分钟前</span>
                </li>
                <li class="achievement" data-type="new">
                  <span class="achievement-icon pixel-border">♦</span>
                  <div class="achievement-main">
                    <span class="achievement-title">迷宫行者</span>
                    <span class="achievement-desc">无伤通关迷宫区域</span>
                  </div>
                  <span class="achievement-time">15分钟前</span>
                </li>
                <li class="achievement">
                  <span class="achievement-icon pixel-border">◆</span>
                  <div class="achievement-main">
                    <span class="achievement-title">宝藏猎人</span>
                    <span class="achievement-desc">发现 50 个隐藏宝箱</span>
                  </div>
                  <span class="achievement-time">1小时前</span>
                </li>
                <li class="achievement">
                  <span class="achievement-icon pixel-border">▲</span>
                  <div class="achievement-main">
                    <span class="achievement-title">连击大师</span>
                    <span class="achievement-desc">达成 50 连击</span>
                  </div>
                  <span class="achievement-time">昨天</span>
                </li>
              </ul>
            </section>

            <!-- 快速操作区 -->
            <section class="action-block">
              <button class="cta-btn pixel-border" data-toast="开始新任务">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                开始新任务
              </button>
              <div class="action-secondary">
                <button class="ghost-btn pixel-border" data-toast="查看图鉴">图鉴</button>
                <button class="ghost-btn pixel-border" data-toast="排行榜">排行</button>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar pixel-border" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>基地</span>
            </button>
            <button class="tab" data-tab="quests">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h6"/></svg>
              <span>任务</span>
            </button>
            <button class="tab" data-tab="achievements">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
              <span>成就</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast pixel-border" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
