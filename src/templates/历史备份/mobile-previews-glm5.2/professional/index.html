<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>WorkSync · Professional</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">WS</span>
                <div class="brand-text">
                  <span class="brand-name">WorkSync</span>
                  <span class="brand-sub">下午好，Ping</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="消息" data-toast="3 条未读消息">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
                <span class="iconbtn__badge">3</span>
              </button>
            </header>

            <!-- 项目总览卡（signature：蓝色商务的清晰聚焦） -->
            <section class="project-card" aria-label="项目总览">
              <div class="project-card__header">
                <p class="project-card__label">本周项目进度</p>
                <span class="project-card__badge">进行中</span>
              </div>
              <p class="project-card__title">Q4 产品发布会</p>
              <div class="project-card__stats">
                <div class="stat">
                  <span class="stat__label">完成度</span>
                  <span class="stat__value stat__value--primary">68%</span>
                </div>
                <div class="stat">
                  <span class="stat__label">剩余任务</span>
                  <span class="stat__value">12</span>
                </div>
                <div class="stat">
                  <span class="stat__label">截止</span>
                  <span class="stat__value stat__value--warn">5天</span>
                </div>
              </div>

              <div class="project-card__progress">
                <span class="project-card__progress-fill" style="--p: 68%"></span>
              </div>

              <div class="project-card__team">
                <span class="project-card__team-label">团队成员</span>
                <div class="avatars">
                  <span class="avatar" style="--bg: #3b82f6">P</span>
                  <span class="avatar" style="--bg: #8b5cf6">A</span>
                  <span class="avatar" style="--bg: #10b981">M</span>
                  <span class="avatar avatar--more">+2</span>
                </div>
              </div>

              <div class="project-card__actions">
                <button class="action-btn action-btn--primary" data-toast="新建任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8"/><path d="M8 12h8" /></svg>新建任务</button>
                <button class="action-btn" data-toast="查看详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3" /></svg>详情</button>
              </div>
            </section>

            <!-- 任务统计双卡 -->
            <section class="stats-row" aria-label="任务统计">
              <div class="stat-card stat-card--pending">
                <span class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14" /></svg>
                </span>
                <span class="stat-card__label">待处理</span>
                <span class="stat-card__value">8</span>
              </div>
              <div class="stat-card stat-card--done">
                <span class="stat-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>
                </span>
                <span class="stat-card__label">已完成</span>
                <span class="stat-card__value">24</span>
              </div>
            </section>

            <!-- 任务列表 -->
            <section class="task-list" aria-label="今日任务">
              <div class="list-block__head">
                <h2>今日任务</h2>
                <div class="chips" id="taskChips" role="tablist" aria-label="筛选任务">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="high" role="tab" aria-selected="false">高优</button>
                  <button class="chip" data-filter="normal" role="tab" aria-selected="false">普通</button>
                </div>
              </div>

              <ul class="tasks" id="taskList">
                <li class="task" data-priority="high">
                  <span class="task__check">
                    <input type="checkbox" aria-label="标记完成">
                  </span>
                  <div class="task__main">
                    <span class="task__title">审核 UI 设计稿</span>
                    <span class="task__meta">设计团队 · 截止 17:00</span>
                  </div>
                  <span class="task__tag task__tag--high">紧急</span>
                </li>
                <li class="task" data-priority="high">
                  <span class="task__check">
                    <input type="checkbox" aria-label="标记完成">
                  </span>
                  <div class="task__main">
                    <span class="task__title">产品需求评审</span>
                    <span class="task__meta">会议室 A · 14:00 开始</span>
                  </div>
                  <span class="task__tag task__tag--high">紧急</span>
                </li>
                <li class="task" data-priority="normal">
                  <span class="task__check">
                    <input type="checkbox" aria-label="标记完成">
                  </span>
                  <div class="task__main">
                    <span class="task__title">周报汇总</span>
                    <span class="task__meta">个人 · 每周五</span>
                  </div>
                  <span class="task__tag task__tag--normal">常规</span>
                </li>
                <li class="task" data-priority="normal">
                  <span class="task__check">
                    <input type="checkbox" aria-label="标记完成">
                  </span>
                  <div class="task__main">
                    <span class="task__title">代码审查</span>
                    <span class="task__meta">技术组 · 5 个 PR</span>
                  </div>
                  <span class="task__tag task__tag--normal">常规</span>
                </li>
                <li class="task" data-priority="normal">
                  <span class="task__check">
                    <input type="checkbox" aria-label="标记完成">
                  </span>
                  <div class="task__main">
                    <span class="task__title">客户反馈整理</span>
                    <span class="task__meta">客服组 · 本周反馈</span>
                  </div>
                  <span class="task__tag task__tag--normal">常规</span>
                </li>
              </ul>
            </section>

            <!-- 日历条 -->
            <section class="calendar-strip" aria-label="本周日程">
              <div class="calendar-strip__head">
                <span class="calendar-strip__title">本周日程</span>
                <span class="calendar-strip__count">6 场会议</span>
              </div>
              <div class="calendar-days" role="list">
                <span class="day" role="listitem">
                  <span class="day__label">一</span>
                  <span class="day__num">12</span>
                </span>
                <span class="day day--active" role="listitem" aria-current="date">
                  <span class="day__label">二</span>
                  <span class="day__num">13</span>
                </span>
                <span class="day day--event" role="listitem">
                  <span class="day__label">三</span>
                  <span class="day__num">14</span>
                  <span class="day__dot"></span>
                </span>
                <span class="day" role="listitem">
                  <span class="day__label">四</span>
                  <span class="day__num">15</span>
                </span>
                <span class="day day--event" role="listitem">
                  <span class="day__label">五</span>
                  <span class="day__num">16</span>
                  <span class="day__dot"></span>
                </span>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></svg>
              <span>工作台</span>
            </button>
            <button class="tab" data-tab="tasks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></svg>
              <span>任务</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="tab" data-tab="calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
              <span>日历</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
