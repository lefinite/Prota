<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Gaming Voice Lounge · Discord</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                </span>
                <div class="brand-text">
                  <span class="brand-name">Voice Lounge</span>
                  <span class="brand-sub">游戏语音社区</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="通知" data-toast="暂无新通知">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" /></svg>
                <span class="iconbtn__dot" aria-hidden="true"></span>
              </button>
            </header>

            <!-- 服务器列表签名：圆角方形容器 -->
            <section class="server-rail" aria-label="服务器列表">
              <div class="server-list">
                <button class="server-item server-item--home" data-toast="首页">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.73 4.87a18.2 18.2 0 0 0-4.6-1.44c-.2.36-.42.84-.58 1.22a16.84 16.84 0 0 0-5.1 0c-.16-.38-.38-.86-.58-1.22a18.18 18.18 0 0 0-4.6 1.44A19.04 19.04 0 0 0 .96 17.7a18.43 18.43 0 0 0 5.63 2.87c.45-.62.85-1.28 1.2-1.98a11.98 11.98 0 0 1-1.9-.92c.16-.12.32-.24.47-.36a13.65 13.65 0 0 0 11.84 0c.15.12.31.24.47.36-.6.35-1.24.65-1.9.92.35.7.75 1.36 1.2 1.98a18.36 18.36 0 0 0 5.63-2.87A19.03 19.03 0 0 0 19.73 4.87zM8.3 15.12c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.95-2.41 2.16-2.41 1.2 0 2.18 1.08 2.16 2.41 0 1.34-.95 2.42-2.16 2.42zm7.4 0c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.95-2.41 2.16-2.41 1.2 0 2.18 1.08 2.16 2.41 0 1.34-.96 2.42-2.16 2.42z"/></svg>
                </button>
                <div class="server-divider"></div>
                <button class="server-item server-item--active" data-active="true" data-toast=" valorant-official">
                  <span class="server-avatar">V</span>
                  <span class="server-pill" aria-hidden="true"></span>
                </button>
                <button class="server-item" data-toast=" apex-legends">
                  <span class="server-avatar">A</span>
                </button>
                <button class="server-item" data-toast=" minecraft-server">
                  <span class="server-avatar">M</span>
                </button>
                <button class="server-item server-item--add" data-toast="添加服务器">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" /></svg>
                </button>
              </div>
            </section>

            <!-- 频道列表卡片 -->
            <section class="channel-card" aria-label="频道列表">
              <div class="channel-header">
                <span class="server-name">Valorant 官方社区</span>
                <svg class="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
              </div>
              <div class="channel-list">
                <div class="channel-category">
                  <span class="category-label">信息频道</span>
                  <button class="channel-item channel-item--active">
                    <span class="channel-hash">#</span>
                    <span class="channel-name">公告</span>
                  </button>
                  <button class="channel-item">
                    <span class="channel-hash">#</span>
                    <span class="channel-name">规则</span>
                  </button>
                  <button class="channel-item">
                    <span class="channel-hash">#</span>
                    <span class="channel-name">更新日志</span>
                  </button>
                </div>
                <div class="channel-category">
                  <span class="category-label">语音频道</span>
                  <button class="channel-item voice-item" data-toast="加入语音">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a10 10 0 0 0-10 10v4a3 3 0 0 0 3 3h2v-8H5v-1a8 8 0 0 1 16 0v1h-2v8h2a3 3 0 0 0 3-3v-4a10 10 0 0 0-10-10z" /><circle cx="12" cy="13" r="3" /></svg>
                    <span class="channel-name">游戏大厅</span>
                    <span class="voice-count">3/10</span>
                  </button>
                  <button class="channel-item voice-item" data-toast="加入语音">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a10 10 0 0 0-10 10v4a3 3 0 0 0 3 3h2v-8H5v-1a8 8 0 0 1 16 0v1h-2v8h2a3 3 0 0 0 3-3v-4a10 10 0 0 0-10-10z" /><circle cx="12" cy="13" r="3" /></svg>
                    <span class="channel-name">排位组队</span>
                    <span class="voice-count">5/10</span>
                  </button>
                </div>
              </div>
            </section>

            <!-- 成员列表 -->
            <section class="members-block" aria-label="在线成员">
              <div class="list-block__head">
                <h2>在线成员 — 8</h2>
                <div class="chips" id="memberFilterChips" role="tablist" aria-label="筛选成员">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="online" role="tab" aria-selected="false">在线</button>
                  <button class="chip" data-filter="idle" role="tab" aria-selected="false">空闲</button>
                </div>
              </div>

              <ul class="member-list" id="memberList">
                <li class="member-item" data-type="online">
                  <div class="member-avatar">
                    <span class="avatar-text">夜</span>
                    <span class="status-dot status-dot--online"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">夜煞</span>
                    <span class="member-status">正在游玩 Valorant</span>
                  </div>
                  <span class="badge badge--blurple">管理员</span>
                </li>
                <li class="member-item" data-type="online">
                  <div class="member-avatar">
                    <span class="avatar-text">影</span>
                    <span class="status-dot status-dot--online"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">影刃</span>
                    <span class="member-status">在 语音大厅</span>
                  </div>
                </li>
                <li class="member-item" data-type="idle">
                  <div class="member-avatar">
                    <span class="avatar-text">风</span>
                    <span class="status-dot status-dot--idle"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">风行者</span>
                    <span class="member-status">离开 15 分钟</span>
                  </div>
                </li>
                <li class="member-item" data-type="online">
                  <div class="member-avatar">
                    <span class="avatar-text">雷</span>
                    <span class="status-dot status-dot--dnd"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">雷霆</span>
                    <span class="member-status">请勿打扰</span>
                  </div>
                </li>
                <li class="member-item" data-type="idle">
                  <div class="member-avatar">
                    <span class="avatar-text">光</span>
                    <span class="status-dot status-dot--offline"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">光辉</span>
                    <span class="member-status">离线</span>
                  </div>
                </li>
                <li class="member-item" data-type="online">
                  <div class="member-avatar">
                    <span class="avatar-text">冰</span>
                    <span class="status-dot status-dot--online"></span>
                  </div>
                  <div class="member-info">
                    <span class="member-name">冰霜</span>
                    <span class="member-status">正在排位</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 活跃度统计 -->
            <section class="activity-card" aria-label="活跃度统计">
              <div class="activity-item">
                <span class="activity-item__label">今日活跃</span>
                <span class="activity-item__value">24 人</span>
              </div>
              <div class="activity-item">
                <span class="activity-item__label">语音峰值</span>
                <span class="activity-item__value">12 人</span>
              </div>
              <div class="activity-item">
                <span class="activity-item__label">消息总数</span>
                <span class="activity-item__value">1.2k</span>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="servers">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></svg>
              <span>服务器</span>
            </button>
            <button class="tab" data-tab="dm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
              <span>私信</span>
            </button>
            <button class="tab tab--fab" data-tab="nitro" aria-label="Nitro">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
            </button>
            <button class="tab" data-tab="shop">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" /></svg>
              <span>商店</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
