<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>录屏消息 · Loom</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" opacity="0"/><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
                </span>
                <div class="brand-text">
                  <span class="brand-name">Loom</span>
                  <span class="brand-sub">工作台</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
              </button>
            </header>

            <!-- 快速录制区：Signature —— 紫色录制按钮 + 脉冲动画 -->
            <section class="record-section" aria-label="快速录制">
              <div class="record-card">
                <div class="record-preview">
                  <div class="record-preview__placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
                    <span>点击录制新视频</span>
                  </div>
                </div>

                <div class="record-controls">
                  <button class="record-btn" data-toast="开始录制...">
                    <span class="record-dot"></span>
                    <span class="record-btn__label">录制</span>
                  </button>
                  <button class="upload-btn" data-toast="上传视频">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15" /></svg>
                    上传
                  </button>
                </div>
              </div>

              <!-- 统计卡片 -->
              <div class="stats-row">
                <div class="stat-item">
                  <span class="stat-item__val">24</span>
                  <span class="stat-item__label">已录制</span>
                </div>
                <div class="stat-item">
                  <span class="stat-item__val">156</span>
                  <span class="stat-item__label">观看次数</span>
                </div>
                <div class="stat-item">
                  <span class="stat-item__val">89%</span>
                  <span class="stat-item__label">完成率</span>
                </div>
              </div>
            </section>

            <!-- 筛选芯片 -->
            <div class="filter-chips" id="filterChips" role="tablist" aria-label="视频筛选">
              <button class="filter-chip is-active" data-filter="all" role="tab" aria-selected="true">
                全部
              </button>
              <button class="filter-chip" data-filter="recent" role="tab" aria-selected="false">
                最近
              </button>
              <button class="filter-chip" data-filter="drafts" role="tab" aria-selected="false">
                草稿 <span class="filter-chip__count">3</span>
              </button>
            </div>

            <!-- 视频缩略图列表 -->
            <section class="video-list" aria-label="我的视频">
              <ul class="video-grid" id="videoGrid">
                <li class="video-card" data-filter="recent">
                  <div class="video-thumb">
                    <div class="video-thumb__bg video-thumb__bg--gradient-1"></div>
                    <div class="video-thumb__overlay">
                      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                      <span class="video-duration">2:34</span>
                    </div>
                    <span class="recording-indicator" aria-label="录制中"></span>
                  </div>
                  <div class="video-info">
                    <h4 class="video-title">产品演示 · 新功能介绍</h4>
                    <div class="video-meta">
                      <span>今天 10:30</span>
                      <span class="video-views">32 次观看</span>
                    </div>
                  </div>
                  <button class="video-menu" aria-label="更多选项" data-toast="视频选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>

                <li class="video-card" data-filter="recent">
                  <div class="video-thumb">
                    <div class="video-thumb__bg video-thumb__bg--gradient-2"></div>
                    <div class="video-thumb__overlay">
                      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                      <span class="video-duration">5:12</span>
                    </div>
                  </div>
                  <div class="video-info">
                    <h4 class="video-title">团队周会 · Q3 规划</h4>
                    <div class="video-meta">
                      <span>昨天 16:00</span>
                      <span class="video-views">48 次观看</span>
                    </div>
                  </div>
                  <button class="video-menu" aria-label="更多选项" data-toast="视频选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>

                <li class="video-card" data-filter="drafts">
                  <div class="video-thumb">
                    <div class="video-thumb__bg video-thumb__bg--draft"></div>
                    <div class="video-thumb__overlay">
                      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                      <span class="video-duration">0:45</span>
                    </div>
                    <span class="draft-badge">草稿</span>
                  </div>
                  <div class="video-info">
                    <h4 class="video-title">API 接口说明</h4>
                    <div class="video-meta">
                      <span>3 天前</span>
                      <span class="video-status">未发布</span>
                    </div>
                  </div>
                  <button class="video-menu" aria-label="更多选项" data-toast="视频选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>

                <li class="video-card" data-filter="recent">
                  <div class="video-thumb">
                    <div class="video-thumb__bg video-thumb__bg--gradient-3"></div>
                    <div class="video-thumb__overlay">
                      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3" /></svg>
                      <span class="video-duration">1:28</span>
                    </div>
                  </div>
                  <div class="video-info">
                    <h4 class="video-title">用户反馈回复</h4>
                    <div class="video-meta">
                      <span>上周</span>
                      <span class="video-views">76 次观看</span>
                    </div>
                  </div>
                  <button class="video-menu" aria-label="更多选项" data-toast="视频选项">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1" /></svg>
                  </button>
                </li>
              </ul>
            </section>

            <!-- 共享链接卡片 -->
            <section class="share-card" aria-label="快速共享">
              <div class="share-card__content">
                <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></svg>
                <div class="share-card__text">
                  <h4 class="share-card__title">快速共享</h4>
                  <p class="share-card__desc">生成可分享的视频链接</p>
                </div>
              </div>
              <button class="share-btn" data-toast="已复制链接！">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>主页</span>
            </button>
            <button class="tab" data-tab="library">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></svg>
              <span>库</span>
            </button>
            <button class="tab tab--record" data-tab="record">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
            </button>
            <button class="tab" data-tab="notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
              <span>通知</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4" /></svg>
              <span>我</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
