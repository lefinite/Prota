<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Research Hub · OpenAI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 8v8M8 12h8"/>
                </svg>
                <div class="brand-text">
                  <span class="brand-name">Research Hub</span>
                  <span class="brand-sub">探索前沿研究</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
            </header>

            <!-- Hero Signature: 编辑器风格的对话输入 -->
            <section class="hero-editor" aria-label="研究助手">
              <div class="editor-header">
                <div class="editor-dots">
                  <span></span><span></span><span></span>
                </div>
                <span class="editor-lang">GPT-4 Research</span>
              </div>
              <div class="editor-body">
                <p class="editor-prompt">今天想探索什么研究方向？</p>
                <p class="editor-cursor">|</p>
              </div>
              <div class="editor-meta">
                <span class="editor-tag">多模态</span>
                <span class="editor-tag">代码解释器</span>
                <span class="editor-tag">联网搜索</span>
              </div>
            </section>

            <!-- 研究项目卡片 -->
            <section class="projects-grid" aria-label="活跃研究">
              <div class="project-card" data-toast="打开项目">
                <div class="project__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <span class="project__title">论文解读</span>
                <span class="project__count">12 篇</span>
              </div>
              <div class="project-card" data-toast="打开项目">
                <div class="project__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </div>
                <span class="project__title">代码分析</span>
                <span class="project__count">8 个</span>
              </div>
            </section>

            <!-- 最近对话列表 -->
            <section class="conversations" aria-label="最近对话">
              <h2 class="section-title">最近对话</h2>

              <div class="chips" id="filterChips" role="tablist">
                <button class="chip is-active" data-filter="all">全部</button>
                <button class="chip" data-filter="research">研究</button>
                <button class="chip" data-filter="code">代码</button>
              </div>

              <ul class="conv-list" id="convList">
                <li class="conv" data-type="research">
                  <span class="conv__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                  </span>
                  <div class="conv__main">
                    <span class="conv__title">Transformer 架构演进分析</span>
                    <span class="conv__sub">今天 10:30 · GPT-4</span>
                  </div>
                  <span class="conv__badge">进行中</span>
                </li>
                <li class="conv" data-type="code">
                  <span class="conv__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                  </span>
                  <div class="conv__main">
                    <span class="conv__title">PyTorch 分布式训练优化</span>
                    <span class="conv__sub">昨天 15:42 · Code Interpreter</span>
                  </div>
                  <span class="conv__badge conv__badge--success">已完成</span>
                </li>
                <li class="conv" data-type="research">
                  <span class="conv__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                  </span>
                  <div class="conv__main">
                    <span class="conv__title">多模态模型对比研究</span>
                    <span class="conv__sub">前天 09:15 · GPT-4V</span>
                  </div>
                  <span class="conv__badge">进行中</span>
                </li>
                <li class="conv" data-type="code">
                  <span class="conv__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                  </span>
                  <div class="conv__main">
                    <span class="conv__title">React 性能优化方案</span>
                    <span class="conv__sub">3 天前 · Code Interpreter</span>
                  </div>
                  <span class="conv__badge conv__badge--success">已完成</span>
                </li>
              </ul>
            </section>

            <!-- 快速操作区 -->
            <section class="actions-card">
              <button class="action-btn action-btn--primary" data-toast="创建新对话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
                新建对话
              </button>
              <button class="action-btn action-btn--secondary" data-toast="浏览模型">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                模型库
              </button>
            </section>

            <div class="bottom-spacer"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="research">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>研究</span>
            </button>
            <button class="tab tab--fab" data-tab="create" aria-label="新建">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="tab" data-tab="library">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>资料库</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
