<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TaskFlow · Flat Design</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-logo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v6M8 2v6M3 10h18"/></svg>
                </div>
                <div class="brand-text">
                  <span class="brand-name">TaskFlow</span>
                  <span class="brand-sub">今日任务 · 8月14日</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索任务">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </button>
            </header>

            <!-- 任务概览卡（signature：扁平 2D 风格，大数字橙色焦点） -->
            <section class="task-hero" aria-label="今日概览">
              <div class="task-hero__bg"></div>
              <p class="task-hero__label">今日待办</p>
              <p class="task-hero__count">12<span class="task-hero__count-total"> / 24</span></p>
              <div class="task-hero__meta">
                <span class="tag tag--success">
                  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3 6 10.5 3 7.5l-1 1L6 12.5 14.5 4l-1-1Z"/></svg>
                  8 已完成
                </span>
                <span class="tag tag--warn">
                  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a6 6 0 0 0-6 6 1 1 0 1 0 2 0 4 4 0 0 1 8 0 1 1 0 1 0 2 0 6 6 0 0 0-6-6Z"/><circle cx="8" cy="14" r="1"/></svg>
                  4 待处理
                </span>
              </div>
              <div class="task-hero__actions">
                <button class="action-btn action-btn--primary" data-toast="新建任务">
                  <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1Z"/></svg>
                  新建任务
                </button>
                <button class="action-btn" data-toast="查看日历">
                  <svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 2a1 1 0 0 1 1 1v1h4V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 18 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 2 15.5v-9A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1ZM4 6v9.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V6H4Z"/></svg>
                </button>
              </div>
            </section>

            <!-- 项目双卡 -->
            <section class="project-row" aria-label="项目概览">
              <div class="project-card project-card--active">
                <span class="project-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                </span>
                <span class="project-card__name">产品迭代</span>
                <span class="project-card__stat">6 任务</span>
                <div class="project-card__progress">
                  <span class="project-card__progress-fill" style="--p: 75%"></span>
                </div>
              </div>
              <div class="project-card">
                <span class="project-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                </span>
                <span class="project-card__name">设计评审</span>
                <span class="project-card__stat">4 任务</span>
                <div class="project-card__progress">
                  <span class="project-card__progress-fill" style="--p: 40%"></span>
                </div>
              </div>
            </section>

            <!-- 任务列表 -->
            <section class="task-list" aria-label="任务列表">
              <div class="section-header">
                <h2>进行中</h2>
                <div class="chips" id="filterChips" role="tablist">
                  <button class="chip is-active" data-filter="all" role="tab">全部</button>
                  <button class="chip" data-filter="high" role="tab">高优先</button>
                  <button class="chip" data-filter="today" role="tab">今日</button>
                </div>
              </div>

              <ul class="task-items" id="taskList">
                <li class="task-item" data-priority="high">
                  <button class="task-check" aria-label="标记完成" data-toast="任务已完成">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3 6 10.5 3 7.5l-1 1L6 12.5 14.5 4l-1-1Z"/></svg>
                  </button>
                  <div class="task-main">
                    <span class="task-title">完成首页交互原型</span>
                    <div class="task-meta">
                      <span class="task-project">产品迭代</span>
                      <span class="task-time">今天 18:00</span>
                    </div>
                  </div>
                  <span class="priority priority--high">高</span>
                </li>
                <li class="task-item" data-priority="normal">
                  <button class="task-check" aria-label="标记完成" data-toast="任务已完成">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3 6 10.5 3 7.5l-1 1L6 12.5 14.5 4l-1-1Z"/></svg>
                  </button>
                  <div class="task-main">
                    <span class="task-title">设计系统 Token 更新</span>
                    <div class="task-meta">
                      <span class="task-project">设计评审</span>
                      <span class="task-time">明天 10:00</span>
                    </div>
                  </div>
                  <span class="priority priority--normal">中</span>
                </li>
                <li class="task-item" data-priority="high">
                  <button class="task-check" aria-label="标记完成" data-toast="任务已完成">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3 6 10.5 3 7.5l-1 1L6 12.5 14.5 4l-1-1Z"/></svg>
                  </button>
                  <div class="task-main">
                    <span class="task-title">API 接口文档编写</span>
                    <div class="task-meta">
                      <span class="task-project">产品迭代</span>
                      <span class="task-time">今天 14:00</span>
                    </div>
                  </div>
                  <span class="priority priority--high">高</span>
                </li>
                <li class="task-item" data-priority="low">
                  <button class="task-check" aria-label="标记完成" data-toast="任务已完成">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3 6 10.5 3 7.5l-1 1L6 12.5 14.5 4l-1-1Z"/></svg>
                  </button>
                  <div class="task-main">
                    <span class="task-title">周报汇总</span>
                    <div class="task-meta">
                      <span class="task-project">产品迭代</span>
                      <span class="task-time">周五 17:00</span>
                    </div>
                  </div>
                  <span class="priority priority--low">低</span>
                </li>
              </ul>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="projects">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>项目</span>
            </button>
            <button class="tab tab--add" data-tab="add" aria-label="新建任务">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="tab" data-tab="team">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>团队</span>
            </button>
            <button class="tab" data-tab="me">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
