<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PromptFlow · Cohere</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">C</div>
                <div class="brand-text">
                  <span class="brand-name">PromptFlow</span>
                  <span class="brand-sub">企业 AI 工作流</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索工作流">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              </button>
            </header>

            <!-- Hero 卡片（Signature：22px 圆角 + serif 标题） -->
            <section class="hero-card" aria-label="工作流概览">
              <h1 class="hero-card__title">AI 工作流编排</h1>
              <p class="hero-card__subtitle">智能提示词管理与自动化流程执行</p>
              <div class="hero-card__stats">
                <div class="hero-stat">
                  <span class="hero-stat__value">24</span>
                  <span class="hero-stat__label">活跃工作流</span>
                </div>
                <div class="hero-stat">
                  <span class="hero-stat__value">1.2K</span>
                  <span class="hero-stat__label">今日执行</span>
                </div>
                <div class="hero-stat">
                  <span class="hero-stat__value">98%</span>
                  <span class="hero-stat__label">成功率</span>
                </div>
              </div>
            </section>

            <!-- 工作流卡片（22px 签名圆角） -->
            <section class="workflows-section" aria-label="工作流列表">
              <div class="section-header">
                <h2>最近工作流</h2>
                <div class="filter-chips" role="tablist" aria-label="筛选工作流">
                  <button class="filter-chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="filter-chip" data-filter="running" role="tab" aria-selected="false">运行中</button>
                  <button class="filter-chip" data-filter="draft" role="tab" aria-selected="false">草稿</button>
                </div>
              </div>

              <ul class="workflow-list" id="workflowList">
                <li class="workflow" data-status="running">
                  <div class="workflow__icon workflow__icon--running">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24"/></svg>
                  </div>
                  <div class="workflow__main">
                    <span class="workflow__title">客户服务自动响应</span>
                    <span class="workflow__meta">GPT-4 · 3 个步骤</span>
                  </div>
                  <div class="workflow__right">
                    <span class="workflow__status workflow__status--running">运行中</span>
                  </div>
                </li>
                <li class="workflow" data-status="running">
                  <div class="workflow__icon workflow__icon--running">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                  </div>
                  <div class="workflow__main">
                    <span class="workflow__title">文档摘要生成</span>
                    <span class="workflow__meta">Command R+ · 2 个步骤</span>
                  </div>
                  <div class="workflow__right">
                    <span class="workflow__status workflow__status--running">运行中</span>
                  </div>
                </li>
                <li class="workflow" data-status="draft">
                  <div class="workflow__icon workflow__icon--draft">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  </div>
                  <div class="workflow__main">
                    <span class="workflow__title">数据分析助手</span>
                    <span class="workflow__meta">GPT-4 · 5 个步骤</span>
                  </div>
                  <div class="workflow__right">
                    <span class="workflow__status workflow__status--draft">草稿</span>
                  </div>
                </li>
                <li class="workflow" data-status="running">
                  <div class="workflow__icon workflow__icon--running">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  </div>
                  <div class="workflow__main">
                    <span class="workflow__title">智能客服对话</span>
                    <span class="workflow__meta">Command · 4 个步骤</span>
                  </div>
                  <div class="workflow__right">
                    <span class="workflow__status workflow__status--running">运行中</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 快速操作 -->
            <section class="quick-actions" aria-label="快速操作">
              <button class="action-btn action-btn--primary" data-toast="创建新工作流">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
                新建工作流
              </button>
              <button class="action-btn action-btn--ghost" data-toast="浏览模板库">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                模板
              </button>
              <button class="action-btn action-btn--ghost" data-toast="查看执行历史">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                历史
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="workflows">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              <span>工作流</span>
            </button>
            <button class="tab" data-tab="prompts">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>提示词</span>
            </button>
            <button class="tab" data-tab="analytics">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
              <span>分析</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
