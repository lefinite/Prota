<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Doodle Notes · Doodle</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-doodle">✎</div>
                <div class="brand-text">
                  <span class="brand-name">Doodle Notes</span>
                  <span class="brand-sub">随手记录，灵感不停</span>
                </div>
              </div>
              <button class="iconbtn doodle-border" aria-label="更多" data-toast="更多选项">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
              </button>
            </header>

            <!-- Hero 卡：signature —— 手绘风格灵感板 -->
            <section class="hero-card doodle-card" aria-label="灵感板">
              <div class="hero-header">
                <span class="hero-label">今日灵感</span>
                <span class="hero-count">12 个想法</span>
              </div>
              <div class="hero-content">
                <p class="hero-quote">"把简单的事情做得有趣，这就是创意的开始"</p>
                <span class="hero-author">— 你的灵感助手</span>
              </div>
              <div class="hero-doodles">
                <span class="doodle-star">★</span>
                <span class="doodle-bulb">💡</span>
                <span class="doodle-heart">♥</span>
              </div>
            </section>

            <!-- 创意卡片 -->
            <section class="idea-row" aria-label="创意收藏">
              <div class="idea-card doodle-card">
                <span class="idea-tag blue">设计</span>
                <span class="idea-title">新 logo 方案</span>
                <span class="idea-preview">三个草图方向</span>
                <span class="idea-time">2小时前</span>
              </div>
              <div class="idea-card doodle-card">
                <span class="idea-tag pink">生活</span>
                <span class="idea-title">周末计划</span>
                <span class="idea-preview">展览 + 咖啡</span>
                <span class="idea-time">昨天</span>
              </div>
            </section>

            <!-- 笔记列表 -->
            <section class="list-block" aria-label="最近笔记">
              <div class="list-block__head">
                <h2>最近笔记</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选笔记">
                  <button class="chip doodle-chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip doodle-chip" data-filter="idea" role="tab" aria-selected="false">灵感</button>
                  <button class="chip doodle-chip" data-filter="todo" role="tab" aria-selected="false">待办</button>
                </div>
              </div>

              <ul class="note-list" id="noteList">
                <li class="note" data-type="idea">
                  <span class="note-icon doodle-icon">✦</span>
                  <div class="note-main">
                    <span class="note-title">产品命名创意</span>
                    <span class="note-desc">想到了 5 个备选名字...</span>
                  </div>
                  <span class="note-time">10分钟前</span>
                </li>
                <li class="note" data-type="idea">
                  <span class="note-icon doodle-icon">✦</span>
                  <div class="note-main">
                    <span class="note-title">配色方案</span>
                    <span class="note-desc">暖色系 + 灰色基调</span>
                  </div>
                  <span class="note-time">30分钟前</span>
                </li>
                <li class="note" data-type="todo">
                  <span class="note-icon doodle-icon">☑</span>
                  <div class="note-main">
                    <span class="note-title">整理设计文件</span>
                    <span class="note-desc">归档旧项目素材</span>
                  </div>
                  <span class="note-time">1小时前</span>
                </li>
                <li class="note" data-type="todo">
                  <span class="note-icon doodle-icon">☑</span>
                  <div class="note-main">
                    <span class="note-title">写周报</span>
                    <span class="note-desc">本周进度汇总</span>
                  </div>
                  <span class="note-time">3小时前</span>
                </li>
              </ul>
            </section>

            <!-- 快速操作区 -->
            <section class="action-block">
              <button class="cta-btn doodle-btn" data-toast="创建新笔记">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                新建笔记
              </button>
              <div class="action-secondary">
                <button class="ghost-btn doodle-border" data-toast="语音输入">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                  语音
                </button>
                <button class="ghost-btn doodle-border" data-toast="拍照识别">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  拍照
                </button>
              </div>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar doodle-tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="notes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span>笔记</span>
            </button>
            <button class="tab" data-tab="ideas">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>灵感</span>
            </button>
            <button class="tab" data-tab="me">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast doodle-toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
