<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>DesignFlow · Figma</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- Hero/渐变首屏（signature：多彩渐变 + 大号字体） -->
            <section class="hero-gradient" aria-label="欢迎">
              <h1 class="hero-title">DesignFlow</h1>
              <p class="hero-subtitle">设计协作，从这里开始</p>
              <button class="hero-cta" data-toast="创建新项目">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Project
              </button>
            </section>

            <!-- 顶部品牌栏（简洁黑白） -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-logo">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2l7 3.5v7.6l-7 3.5-7-3.5V7.7l7-3.5z"/>
                  </svg>
                </div>
                <span class="brand-name">DesignFlow</span>
              </div>
              <button class="icon-btn-circle" aria-label="搜索" data-toast="搜索文件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </button>
            </header>

            <!-- 项目标签（mono 大写） -->
            <section class="project-tabs" aria-label="项目类型">
              <div class="section-label">PROJECTS</div>
              <div class="tab-pills" role="tablist" aria-label="项目类型筛选">
                <button class="tab-pill is-active" data-tab="recent" role="tab" aria-selected="true">Recent</button>
                <button class="tab-pill" data-tab="shared" role="tab" aria-selected="false">Shared</button>
                <button class="tab-pill" data-tab="starred" role="tab" aria-selected="false">Starred</button>
              </div>
            </section>

            <!-- 设计文件列表 -->
            <section class="file-grid" aria-label="设计文件">
              <div class="file-card" data-type="fig">
                <div class="file-preview" style="background: linear-gradient(135deg, #A855F7 0%, #EC4899 100%);">
                  <span class="file-icon">F</span>
                </div>
                <div class="file-info">
                  <h3 class="file-title">App Redesign</h3>
                  <p class="file-meta">Edited 2h ago</p>
                </div>
                <button class="file-action" aria-label="更多选项" data-toast="文件选项">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
              </div>

              <div class="file-card" data-type="fig">
                <div class="file-preview" style="background: linear-gradient(135deg, #22C55E 0%, #14B8A6 100%);">
                  <span class="file-icon">F</span>
                </div>
                <div class="file-info">
                  <h3 class="file-title">Dashboard Kit</h3>
                  <p class="file-meta">Edited 5h ago</p>
                </div>
                <button class="file-action" aria-label="更多选项" data-toast="文件选项">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
              </div>

              <div class="file-card" data-type="frame">
                <div class="file-preview" style="background: linear-gradient(135deg, #F59E0B 0%, #EF4444 100%);">
                  <span class="file-icon">🎨</span>
                </div>
                <div class="file-info">
                  <h3 class="file-title">Brand Guidelines</h3>
                  <p class="file-meta">Edited 1d ago</p>
                </div>
                <button class="file-action" aria-label="更多选项" data-toast="文件选项">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
              </div>
            </section>

            <!-- 团队成员 -->
            <section class="team-section" aria-label="团队成员">
              <div class="section-label">TEAM</div>
              <div class="team-avatars">
                <div class="avatar" style="background: linear-gradient(135deg, #3B82F6, #8B5CF6);">A</div>
                <div class="avatar" style="background: linear-gradient(135deg, #EC4899, #F59E0B);">M</div>
                <div class="avatar" style="background: linear-gradient(135deg, #10B981, #3B82F6);">S</div>
                <div class="avatar avatar--add">+</div>
              </div>
            </section>

            <!-- 快速操作（pill 按钮） -->
            <section class="quick-actions" aria-label="快速操作">
              <button class="action-pill action-pill--primary" data-toast="导入文件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Import
              </button>
              <button class="action-pill action-pill--ghost" data-toast="浏览模板">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Templates
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab（pill 风格） -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>Home</span>
            </button>
            <button class="tab" data-tab="drafts">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
              <span>Drafts</span>
            </button>
            <button class="tab" data-tab="teams">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Teams</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m0 7.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"></path></svg>
              <span>Settings</span>
            </button>
          </nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
