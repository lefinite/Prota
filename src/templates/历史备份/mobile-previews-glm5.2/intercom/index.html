<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Messenger · Intercom</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏：Saans 紧凑字距 + Fin 点缀 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">Fin</div>
                <div class="brand-text">
                  <span class="brand-name">Messenger</span>
                  <span class="brand-sub">AI Helpdesk</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="通知" data-toast="暂无新通知">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" /></svg>
                <span class="iconbtn__dot" aria-hidden="true"></span>
              </button>
            </header>

            <!-- Hero Card：Fin 签名（signature）—— 橙色单一聚焦点 -->
            <section class="hero-card" aria-label="AI 概览">
              <p class="hero-card__label">FIN AI RESOLUTION</p>
              <p class="hero-card__value">87%</p>
              <p class="hero-card__desc">会话自动解决率</p>
              <div class="hero-card__meta">
                <span class="stat-dot stat-dot--orange"></span>
                <span>较上周 +12%</span>
              </div>
              <div class="hero-card__chart" aria-hidden="true">
                <span class="chart-bar" style="--h: 45%"></span>
                <span class="chart-bar" style="--h: 62%"></span>
                <span class="chart-bar" style="--h: 58%"></span>
                <span class="chart-bar" style="--h: 71%"></span>
                <span class="chart-bar" style="--h: 87%"></span>
              </div>
            </section>

            <!-- 双卡片：温暖奶油色卡片 + 燕麦边框 -->
            <section class="stat-row" aria-label="关键指标">
              <div class="stat-card">
                <span class="stat-card__label">活跃会话</span>
                <span class="stat-card__value">142</span>
                <span class="stat-card__meta">
                  <span class="pip pip--orange"></span>
                  当前在线
                </span>
              </div>
              <div class="stat-card">
                <span class="stat-card__label">平均响应</span>
                <span class="stat-card__value">2.4<span class="stat-card__unit">m</span></span>
                <span class="stat-card__meta">
                  <span class="pip pip--green"></span>
                  目标内
                </span>
              </div>
            </section>

            <!-- 会话列表：列表式 + 状态徽标 -->
            <section class="list-block" aria-label="活跃会话">
              <div class="list-block__head">
                <h2>活跃会话</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选会话">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="unread" role="tab" aria-selected="false">未读</button>
                  <button class="chip" data-filter="ai" role="tab" aria-selected="false">AI</button>
                </div>
              </div>

              <ul class="conv-list" id="convList">
                <li class="conv" data-type="unread">
                  <span class="conv__avatar" style="--bg: #65b5ff">L</span>
                  <div class="conv__main">
                    <span class="conv__title">Lisa Chen</span>
                    <span class="conv__preview">如何设置自动回复规则？</span>
                  </div>
                  <div class="conv__right">
                    <span class="conv__time">2m</span>
                    <span class="badge badge--orange">Fin</span>
                  </div>
                </li>
                <li class="conv" data-type="ai">
                  <span class="conv__avatar" style="--bg: #0bdf50">M</span>
                  <div class="conv__main">
                    <span class="conv__title">Mike Wang</span>
                    <span class="conv__preview">感谢快速解答！</span>
                  </div>
                  <div class="conv__right">
                    <span class="conv__time">15m</span>
                    <span class="badge badge--green">已解决</span>
                  </div>
                </li>
                <li class="conv" data-type="unread">
                  <span class="conv__avatar" style="--bg: #ff2067">S</span>
                  <div class="conv__main">
                    <span class="conv__title">Sarah Liu</span>
                    <span class="conv__preview">账号升级流程咨询</span>
                  </div>
                  <div class="conv__right">
                    <span class="conv__time">1h</span>
                    <span class="badge badge--pink">待回复</span>
                  </div>
                </li>
                <li class="conv" data-type="ai">
                  <span class="conv__avatar" style="--bg: #b3e01c">J</span>
                  <div class="conv__main">
                    <span class="conv__title">James Zhang</span>
                    <span class="conv__preview">API 集成问题已处理</span>
                  </div>
                  <div class="conv__right">
                    <span class="conv__time">3h</span>
                    <span class="badge badge--green">已完成</span>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 快速操作：4px 锐角按钮 -->
            <section class="action-grid">
              <button class="action-btn" data-toast="新建会话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
                新建会话
              </button>
              <button class="action-btn" data-toast="查看知识库">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                知识库
              </button>
              <button class="action-btn" data-toast="数据报告">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
                报告
              </button>
              <button class="action-btn" data-toast="设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg>
                设置
              </button>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab：4px 锐角 -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="inbox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <span>收件箱</span>
            </button>
            <button class="tab" data-tab="contacts">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>联系人</span>
            </button>
            <button class="tab tab--fab" data-tab="compose" aria-label="撰写">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="tab" data-tab="reports">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
              <span>报告</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
