<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>简事 · Simple</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">简</span>
                <div class="brand-text">
                  <span class="brand-name">简事</span>
                  <span class="brand-sub">今天，专注要事</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="搜索" data-toast="搜索功能">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" /></svg>
              </button>
            </header>

            <!-- 任务计数卡（signature：极简大数字，单一主色聚焦） -->
            <section class="count-card" aria-label="今日任务总览">
              <p class="count-card__label">今日待完成</p>
              <p class="count-card__number">8</p>
              <div class="count-card__meta">
                <span class="count-card__progress">
                  <span class="count-card__progress-fill" style="--p: 62.5%"></span>
                </span>
                <span class="count-card__text">已完成 5/8</span>
              </div>

              <div class="count-card__actions">
                <button class="quickbtn" data-toast="添加新任务">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                  新建
                </button>
                <button class="quickbtn" data-toast="查看日历">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10" /></svg>
                  日历
                </button>
                <button class="quickbtn" data-toast="任务统计">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3" /></svg>
                  统计
                </button>
                <button class="quickbtn" data-toast="设置提醒">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
                  提醒
                </button>
              </div>
            </section>

            <!-- 分类双卡 -->
            <section class="category-row" aria-label="任务分类">
              <div class="category-card category-card--work">
                <span class="category-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>
                </span>
                <span class="category-card__cap">工作</span>
                <span class="category-card__val">5 项</span>
              </div>
              <div class="category-card category-card--personal">
                <span class="category-card__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4" /></svg>
                </span>
                <span class="category-card__cap">个人</span>
                <span class="category-card__val">3 项</span>
              </div>
            </section>

            <!-- 任务列表 -->
            <section class="task-block" aria-label="今日任务">
              <div class="task-block__head">
                <h2>今日任务</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选任务">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="pending" role="tab" aria-selected="false">待办</button>
                  <button class="chip" data-filter="done" role="tab" aria-selected="false">完成</button>
                </div>
              </div>

              <ul class="task-list" id="taskList">
                <li class="task" data-status="pending">
                  <label class="task__check">
                    <input type="checkbox" aria-label="标记为完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title">完成产品设计稿</span>
                    <span class="task__sub">工作 · 高优先级</span>
                  </div>
                  <span class="badge badge--priority">高</span>
                </li>
                <li class="task" data-status="done">
                  <label class="task__check">
                    <input type="checkbox" checked aria-label="标记为未完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title task__title--done">团队周会</span>
                    <span class="task__sub">工作 · 已完成</span>
                  </div>
                  <span class="badge badge--success">完成</span>
                </li>
                <li class="task" data-status="pending">
                  <label class="task__check">
                    <input type="checkbox" aria-label="标记为完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title">阅读技术文章</span>
                    <span class="task__sub">个人 · 学习</span>
                  </div>
                  <span class="badge badge--normal">中</span>
                </li>
                <li class="task" data-status="pending">
                  <label class="task__check">
                    <input type="checkbox" aria-label="标记为完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title">健身运动 30 分钟</span>
                    <span class="task__sub">个人 · 健康</span>
                  </div>
                  <span class="badge badge--normal">中</span>
                </li>
                <li class="task" data-status="done">
                  <label class="task__check">
                    <input type="checkbox" checked aria-label="标记为未完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title task__title--done">回复客户邮件</span>
                    <span class="task__sub">工作 · 已完成</span>
                  </div>
                  <span class="badge badge--success">完成</span>
                </li>
                <li class="task" data-status="pending">
                  <label class="task__check">
                    <input type="checkbox" aria-label="标记为完成">
                    <span class="task__checkbox"></span>
                  </label>
                  <div class="task__main">
                    <span class="task__title">整理月度报告</span>
                    <span class="task__sub">工作 · 报告</span>
                  </div>
                  <span class="badge badge--priority">高</span>
                </li>
              </ul>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10" /></svg>
              <span>日历</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建任务">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="tab" data-tab="focus">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" /></svg>
              <span>专注</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m5.3-10.7-4.2 4.2m0 4.2 4.2 4.2M1 12h6m6 0h6m-2.3-9.3 4.2 4.2m0 4.2-4.2 4.2" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
