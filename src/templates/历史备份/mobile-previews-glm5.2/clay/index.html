<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>艺文手账 · Clay</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <div class="brand-mark">艺</div>
                <div class="brand-text">
                  <span class="brand-name">艺文手账</span>
                  <span class="brand-sub">收集灵感碎片</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="创意箱" data-toast="3 个待整理灵感">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" y1="22.08" x2="12" y2="12" /></svg>
                <span class="iconbtn__badge" aria-hidden="true">3</span>
              </button>
            </header>

            <!-- Hero 灵感卡片（signature：多彩抹茶绿背景 + 旋转按钮） -->
            <section class="hero-card hero-card--matcha" aria-label="本周灵感">
              <p class="hero-card__label">本周收集</p>
              <p class="hero-card__amount">24<span class="unit">个灵感</span></p>
              <div class="hero-card__swatches">
                <span class="swatch swatch--lemon" style="--swatch: #fbbd41"></span>
                <span class="swatch swatch--ube" style="--swatch: #43089f"></span>
                <span class="swatch swatch--pomegranate" style="--swatch: #fc7981"></span>
                <span class="swatch swatch--slushie" style="--swatch: #3bd3fd"></span>
              </div>
              <button class="hero-card__cta clay-btn" data-toast="开始创作模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                新建手账
              </button>
            </section>

            <!-- 创意分类卡 -->
            <section class="category-row" aria-label="创意分类">
              <div class="category-card category-card--solid">
                <span class="category-card__icon">🎨</span>
                <span class="category-card__name">色彩灵感</span>
                <span class="category-card__count">12</span>
              </div>
              <div class="category-card category-card--dashed">
                <span class="category-card__icon">✍️</span>
                <span class="category-card__name">文字草稿</span>
                <span class="category-card__count">8</span>
              </div>
            </section>

            <!-- 灵感列表 -->
            <section class="list-block" aria-label="最近灵感">
              <div class="list-block__head">
                <h2>最近收集</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选灵感">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="image" role="tab" aria-selected="false">图片</button>
                  <button class="chip" data-filter="text" role="tab" aria-selected="false">文字</button>
                </div>
              </div>

              <ul class="inspire-list" id="inspireList">
                <li class="inspire" data-type="image">
                  <div class="inspire__thumb inspire__thumb--gradient-1"></div>
                  <div class="inspire__main">
                    <span class="inspire__title">日落渐变色彩</span>
                    <span class="inspire__sub">今天 14:32 · 色彩灵感</span>
                  </div>
                  <div class="inspire__right">
                    <button class="like-btn" data-toast="已收藏" aria-label="收藏">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
                    </button>
                  </div>
                </li>
                <li class="inspire" data-type="text">
                  <div class="inspire__thumb inspire__thumb--text">文</div>
                  <div class="inspire__main">
                    <span class="inspire__title">设计项目命名思路</span>
                    <span class="inspire__sub">昨天 21:15 · 文字草稿</span>
                  </div>
                  <div class="inspire__right">
                    <button class="like-btn liked" data-toast="取消收藏" aria-label="取消收藏">
                      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
                    </button>
                  </div>
                </li>
                <li class="inspire" data-type="image">
                  <div class="inspire__thumb inspire__thumb--gradient-2"></div>
                  <div class="inspire__main">
                    <span class="inspire__title">薄荷绿配色方案</span>
                    <span class="inspire__sub">前天 16:40 · 色彩灵感</span>
                  </div>
                  <div class="inspire__right">
                    <button class="like-btn" data-toast="已收藏" aria-label="收藏">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
                    </button>
                  </div>
                </li>
                <li class="inspire" data-type="image">
                  <div class="inspire__thumb inspire__thumb--gradient-3"></div>
                  <div class="inspire__main">
                    <span class="inspire__title">芋头紫质感参考</span>
                    <span class="inspire__sub">3天前 · 材质灵感</span>
                  </div>
                  <div class="inspire__right">
                    <button class="like-btn" data-toast="已收藏" aria-label="收藏">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
                    </button>
                  </div>
                </li>
              </ul>
            </section>

            <!-- 创作进度条 -->
            <section class="progress-card" aria-label="手账进度">
              <div class="progress-card__head">
                <span class="progress-card__title">本周手账</span>
                <span class="progress-card__num">3 <span class="muted">/ 5 篇</span></span>
              </div>
              <div class="progress-card__bar" aria-hidden="true">
                <span class="progress-card__bar-fill progress-card__bar-fill--matcha" style="--p: 60%"></span>
              </div>
              <p class="progress-card__note">已完成 60%，本周目标还有 2 篇。</p>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>收集</span>
            </button>
            <button class="tab" data-tab="journal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
              <span>手账</span>
            </button>
            <button class="tab tab--fab clay-btn" data-tab="create" aria-label="新建">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="tab" data-tab="explore">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></svg>
              <span>发现</span>
            </button>
            <button class="tab" data-tab="me">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
