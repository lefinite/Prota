<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Notion Workspace · Notion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="demo-stage">
      <div class="phone-shell">
        <div class="phone-screen" id="phoneScreen">
          <div class="status-bar" aria-label="设备状态栏">
            <span class="status-bar__time" id="statusTime">9:41</span>
            <div class="status-bar__island" aria-hidden="true"></div>
            <div class="status-bar__right" aria-hidden="true">
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4" /></svg>
              <svg class="status-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v.01M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 14 0M1.5 9.5a15 15 0 0 1 21 0" /></svg>
              <span class="battery"></span>
            </div>
          </div>

          <main class="app-content" id="appContent">
            <!-- 顶部品牌栏 -->
            <header class="topbar">
              <div class="topbar__brand">
                <span class="brand-mark">N</span>
                <div class="brand-text">
                  <span class="brand-name">My Workspace</span>
                  <span class="brand-sub">早晨好，Ping</span>
                </div>
              </div>
              <button class="iconbtn" aria-label="通知" data-toast="暂无新通知">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" /></svg>
                <span class="iconbtn__dot" aria-hidden="true"></span>
              </button>
            </header>

            <!-- Hero 任务统计卡（signature：Notion Blue 聚焦点） -->
            <section class="hero-card" aria-label="今日概览">
              <p class="hero-card__label">Today</p>
              <p class="hero-card__amount">5 个任务</p>
              <div class="hero-card__meta">
                <span class="badge badge--success">3 完成</span>
                <span class="badge badge--warn">2 进行中</span>
              </div>

              <div class="hero-card__progress" aria-hidden="true">
                <span class="hero-card__progress-fill" style="--p: 60%"></span>
              </div>

              <div class="hero-card__actions">
                <button class="quickbtn" data-toast="新建页面">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                  新建页面
                </button>
                <button class="quickbtn" data-toast="添加数据库">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9" /></svg>
                  数据库
                </button>
                <button class="quickbtn" data-toast="添加模板">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" /></svg>
                  模板
                </button>
                <button class="quickbtn" data-toast="导入文件">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" /></svg>
                  导入
                </button>
              </div>
            </section>

            <!-- 页面卡片双栏 -->
            <section class="page-row" aria-label="最近页面">
              <div class="page-card">
                <span class="page-card__icon page-card__icon--note">📝</span>
                <span class="page-card__title">会议笔记</span>
                <span class="page-card__meta">2 小时前</span>
              </div>
              <div class="page-card">
                <span class="page-card__icon page-card__icon--todo">✓</span>
                <span class="page-card__title">本周待办</span>
                <span class="page-card__meta">昨天</span>
              </div>
            </section>

            <!-- 任务列表 -->
            <section class="list-block" aria-label="任务列表">
              <div class="list-block__head">
                <h2>今日任务</h2>
                <div class="chips" id="filterChips" role="tablist" aria-label="筛选任务">
                  <button class="chip is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
                  <button class="chip" data-filter="active" role="tab" aria-selected="false">进行中</button>
                  <button class="chip" data-filter="done" role="tab" aria-selected="false">已完成</button>
                </div>
              </div>

              <ul class="task-list" id="taskList">
                <li class="task" data-status="active">
                  <span class="task__check" tabindex="0" role="checkbox" aria-checked="false"></span>
                  <div class="task__main">
                    <span class="task__title">完成产品设计文档</span>
                    <span class="task__sub">今天 10:00 · 工作项目</span>
                  </div>
                  <span class="badge badge--blue">高优先</span>
                </li>
                <li class="task" data-status="done">
                  <span class="task__check task__check--checked" tabindex="0" role="checkbox" aria-checked="true"></span>
                  <div class="task__main">
                    <span class="task__title task__title--done">晨会同步</span>
                    <span class="task__sub">今天 09:00 · 会议</span>
                  </div>
                  <span class="badge badge--success">已完成</span>
                </li>
                <li class="task" data-status="active">
                  <span class="task__check" tabindex="0" role="checkbox" aria-checked="false"></span>
                  <div class="task__main">
                    <span class="task__title">代码评审 PR #234</span>
                    <span class="task__sub">今天 14:00 · 开发</span>
                  </div>
                  <span class="badge badge--muted">普通</span>
                </li>
                <li class="task" data-status="done">
                  <span class="task__check task__check--checked" tabindex="0" role="checkbox" aria-checked="true"></span>
                  <div class="task__main">
                    <span class="task__title task__title--done">更新周报</span>
                    <span class="task__sub">昨天 18:00 · 文档</span>
                  </div>
                  <span class="badge badge--success">已完成</span>
                </li>
                <li class="task" data-status="active">
                  <span class="task__check" tabindex="0" role="checkbox" aria-checked="false"></span>
                  <div class="task__main">
                    <span class="task__title">阅读 API 文档</span>
                    <span class="task__sub">今天 16:00 · 学习</span>
                  </div>
                  <span class="badge badge--muted">待定</span>
                </li>
              </ul>
            </section>

            <!-- 数据库视图卡 -->
            <section class="database-card" aria-label="项目进度">
              <div class="database-card__head">
                <span class="database-card__title">项目进度追踪</span>
                <span class="database-card__count">12 个项目</span>
              </div>
              <div class="database-card__bar" aria-hidden="true">
                <span class="database-card__bar-fill" style="--p: 75%"></span>
              </div>
              <p class="database-card__note">本周完成 75%，还需处理 3 个项目。</p>
            </section>

            <div class="bottom-spacer" aria-hidden="true"></div>
          </main>

          <!-- 底部 Tab -->
          <nav class="tabbar" aria-label="主导航">
            <button class="tab is-active" data-tab="home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5 10v10h14V10" /></svg>
              <span>工作区</span>
            </button>
            <button class="tab" data-tab="tasks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></svg>
              <span>任务</span>
            </button>
            <button class="tab tab--fab" data-tab="add" aria-label="新建">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="tab" data-tab="database">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9" /></svg>
              <span>数据库</span>
            </button>
            <button class="tab" data-tab="settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24" /></svg>
              <span>设置</span>
            </button>
          </nav>

          <!-- Toast -->
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
